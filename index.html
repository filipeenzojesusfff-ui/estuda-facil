body{

}

.card{
background:white;

padding:20px;

.buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:10px;

}

button{
border:0;
border-radius:11px;
padding:13px 15px;
background:#2563eb;
color:#fff;
font-size:16px;
cursor:pointer;
margin:4px 0;
}

button:hover{
opacity:.9;
}

.green{
background:#16a34a;
}

.purple{
background:#7c3aed;
}

.orange{
background:#ea580c;
}

.gray{
background:#64748b;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:15px;
margin:12px 0;
}

.option{
display:block;
width:100%;
text-align:left;
background:#e2e8f0;
color:#111827;
}

.correct{
background:#22c55e!important;
color:white!important;
}

.wrong{
background:#ef4444!important;
color:white!important;
}

.bar{
height:18px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
}

.bar div{
height:100%;
background:#22c55e;
width:0;
}

.badge{
display:inline-block;
background:#fef3c7;
padding:8px;
border-radius:10px;
margin:3px;
font-size:13px;
}

.score{
text-align:center;
font-size:23px;
font-weight:bold;
padding:20px;
}

.dark{
background:#0f172a;
color:#f8fafc;
}

.dark .card{
background:#1e293b;
}

.dark select,
.dark input{
background:#334155;
color:white;
}

.dark .option{
background:#334155;
color:white;
}

.small{
font-size:13px;
opacity:.75;
}

@media(max-width:650px){

.grid,
.buttons{
grid-template-columns:1fr;
}

header h1{
font-size:25px;
}

}

</style>
</head>

</div>

</button>

class="orange"
id="sim">
🎯 Simulado geral
</button>

<button
class="green"
id="des">
🔥 Desafio
</button>

<button
class="gray"
id="hard">
💪 Desafio difícil
</button>

<button
class="gray"
id="dark">
🌙 Modo escuro
</button>

</div>

</div>

<h2>👋 Bem-vindo!</h2>

<p>
Escolha o ano, a matéria e o assunto.

</p>

</div>

const state = {
    xp: Number(localStorage.getItem("ef_xp") || 0),
    acertos: 0,
    respondidas: 0
};

function atualizarXP(){
    const el = document.getElementById("xp");
    if(el) el.textContent = state.xp;

    const nivel = Math.floor(state.xp / 100) + 1;
    const nivelEl = document.getElementById("nivel");

    if(nivelEl) nivelEl.textContent = nivel;

    localStorage.setItem("ef_xp", state.xp);
}

function ganharXP(valor){
    state.xp += valor;
    atualizarXP();
}

function assuntoAtual(){
    const el = document.getElementById("assunto");
    return el ? el.value : "";
}

function mostrarMensagem(texto){
    const el = document.getElementById("mensagem");
    if(el) el.textContent = texto;
}

function limparArea(){
    const area = document.getElementById("conteudo");
    if(area) area.innerHTML = "";
}

function carregarAssuntos(){
    const materia = document.getElementById("materia");
    const assunto = document.getElementById("assunto");

    if(!materia || !assunto) return;

    const selecionada = materia.value;

    assunto.innerHTML = "";

    if(DATA.subjects[selecionada]){
        const anos = DATA.subjects[selecionada];

        Object.keys(anos).forEach(ano => {

            const grupo = document.createElement("optgroup");
            grupo.label = ano;

            anos[ano].forEach(nome => {
                const option = document.createElement("option");
                option.value = nome;
                option.textContent = nome;
                grupo.appendChild(option);
            });

            assunto.appendChild(grupo);
        });
    }
}

function mostrarComoFunciona(){

    const assunto = assuntoAtual();

    const area = document.getElementById("conteudo");

    if(!area) return;

    area.innerHTML = `
        <div class="card">
            <h2>📚 Como funciona?</h2>

            <h3>${assunto}</h3>

            <p>${obterExplicacao(assunto)}</p>

            <p>
                Primeiro leia a explicação. Depois faça os exercícios
                e tente a provinha para testar o que aprendeu.
            </p>
        </div>
    `;
}

function pegarQuestoes(){

    const assunto = assuntoAtual();

    if(QUESTOES[assunto]){
        return QUESTOES[assunto];
    }

    return [
        [
            "Qual alternativa está relacionada ao assunto " + assunto + "?",
            [assunto,"Matemática","História"],
            0
        ],
        [
            "O estudo de " + assunto + " ajuda a aprender novos conhecimentos?",
            ["Sim","Não","Nunca"],
            0
        ],
        [
            "Depois de estudar " + assunto + ", o que é recomendado fazer?",
            ["Praticar","Parar de estudar","Ignorar o conteúdo"],
            0
        ]
    ];
}

function criarQuestoes(titulo, quantidade, premio){

    const area = document.getElementById("conteudo");

    if(!area) return;

    const banco = pegarQuestoes();

    let questoes = [];

    for(let i = 0; i < quantidade; i++){
        questoes.push(banco[i % banco.length]);
    }

    state.acertos = 0;
    state.respondidas = 0;

    let html = `
        <div class="card">
            <h2>${titulo}</h2>
            <p>📚 Assunto: <strong>${assuntoAtual()}</strong></p>
            <div id="placar">Questão 0 de ${questoes.length}</div>
        </div>
    `;

    questoes.forEach((q, indice) => {

        html += `
            <div class="card questao" data-resolvida="false">
                <h3>${indice + 1}. ${q[0]}</h3>
                <div class="opcoes">
        `;

        q[1].forEach((opcao, numero) => {

            html += `
                <button
                    class="resposta"
                    data-correta="${q[2]}"
                    data-escolhida="${numero}">
                    ${opcao}
                </button>
            `;
        });

        html += `
                </div>
                <p class="resultado"></p>
            </div>
        `;
    });

    html += `
        <div class="card">
            <button id="finalizar">🏁 Finalizar</button>
            <div id="resultadoFinal"></div>
        </div>
    `;

    area.innerHTML = html;

    const botoes = area.querySelectorAll(".resposta");

    botoes.forEach(botao => {

        botao.addEventListener("click", function(){

            const questao = this.closest(".questao");

            if(questao.dataset.resolvida === "true"){
                return;
            }

            questao.dataset.resolvida = "true";

            const botoesQuestao =
                questao.querySelectorAll(".resposta");

            botoesQuestao.forEach(b => {
                b.disabled = true;
            });

            const correta = Number(this.dataset.correta);
            const escolhida = Number(this.dataset.escolhida);

            const resultado =
                questao.querySelector(".resultado");

            if(escolhida === correta){

                this.classList.add("certa");

                resultado.textContent =
                    "🎉 Acertou! +10 XP";

                state.acertos++;

                ganharXP(10);

            }else{

                this.classList.add("errada");

                botoesQuestao[correta].classList.add("certa");

                resultado.textContent =
                    "❌ Errou! A resposta correta está marcada em verde.";
            }

            state.respondidas++;

            const placar =
                document.getElementById("placar");

            if(placar){

                placar.textContent =
                    `Questão ${state.respondidas} de ${questoes.length}`;
            }
        });
    });

    document.getElementById("finalizar")
        .addEventListener("click", function(){

            const total = questoes.length;

            const nota =
                (state.acertos / total) * 10;

            const resultado =
                document.getElementById("resultadoFinal");

            let mensagem = "";

            if(nota >= 9){
                mensagem = "🏆 Excelente!";
            }else if(nota >= 7){
                mensagem = "👏 Muito bom!";
            }else if(nota >= 5){
                mensagem = "👍 Continue praticando!";
            }else{
                mensagem = "📚 Revise o conteúdo e tente novamente!";
            }

            resultado.innerHTML = `
                <h2>📊 Resultado</h2>

                <p>
                    Você acertou
                    <strong>${state.acertos}</strong>
                    de
                    <strong>${total}</strong>.
                </p>

                <h2>Nota: ${nota.toFixed(1)} / 10</h2>

                <p>${mensagem}</p>
            `;
        });
}

function mostrarProvinhaMateria(){

    const materia =
        document.getElementById("materia").value;

    const assuntos = [];

    if(DATA.subjects[materia]){

        Object.values(DATA.subjects[materia]).forEach(lista => {

            lista.forEach(item => {
                assuntos.push(item);
            });

        });
    }

    let banco = [];

    assuntos.forEach(item => {

        if(QUESTOES[item]){
            banco = banco.concat(QUESTOES[item]);
        }

    });

    if(banco.length === 0){

        banco = pegarQuestoes();

    }

    const area = document.getElementById("conteudo");

    let html = `
        <div class="card">
            <h2>📚 Provinha de ${materia}</h2>
            <p>Teste seus conhecimentos em vários assuntos.</p>
        </div>
    `;

    const quantidade =
        Math.min(10, banco.length);

    state.acertos = 0;
    state.respondidas = 0;

    for(let i = 0; i < quantidade; i++){

        const q = banco[i];

        html += `
            <div class="card questao" data-resolvida="false">

                <h3>${i + 1}. ${q[0]}</h3>

                <div class="opcoes">
        `;

        q[1].forEach((opcao, numero) => {

            html += `
                <button
                    class="resposta"
                    data-correta="${q[2]}"
                    data-escolhida="${numero}">
                    ${opcao}
                </button>
            `;
        });

        html += `
                </div>

                <p class="resultado"></p>

            </div>
        `;
    }

    html += `
        <div class="card">

            <button id="finalizarMateria">
                🏁 Finalizar prova
            </button>

            <div id="resultadoFinal"></div>

        </div>
    `;

    area.innerHTML = html;

    area.querySelectorAll(".resposta")
        .forEach(botao => {

            botao.addEventListener("click", function(){

                const questao =
                    this.closest(".questao");

                if(
                    questao.dataset.resolvida === "true"
                ){
                    return;
                }

                questao.dataset.resolvida = "true";

                const botoes =
                    questao.querySelectorAll(".resposta");

                botoes.forEach(b => {
                    b.disabled = true;
                });

                const correta =
                    Number(this.dataset.correta);

                const escolhida =
                    Number(this.dataset.escolhida);

                if(escolhida === correta){

                    this.classList.add("certa");

                    questao.querySelector(".resultado")
                        .textContent =
                        "🎉 Acertou! +10 XP";

                    state.acertos++;

                    ganharXP(10);

                }else{

                    this.classList.add("errada");

                    botoes[correta]
                        .classList.add("certa");

                    questao.querySelector(".resultado")
                        .textContent =
                        "❌ Resposta incorreta.";
                }

                state.respondidas++;
            });
        });

    document.getElementById("finalizarMateria")
        .addEventListener("click", function(){

            const nota =
                (state.acertos / quantidade) * 10;

            document.getElementById("resultadoFinal")
                .innerHTML = `
                    <h2>📊 Resultado</h2>

                    <p>
                        Acertos:
                        <strong>
                            ${state.acertos}/${quantidade}
                        </strong>
                    </p>

                    <h2>
                        Nota:
                        ${nota.toFixed(1)}/10
                    </h2>
                `;
        });
}

function modoEscuro(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "ef_dark",
        document.body.classList.contains("dark")
    );
}

function resetar(){

    if(confirm("Tem certeza que deseja apagar seu progresso?")){

        localStorage.removeItem("ef_xp");

        state.xp = 0;

        atualizarXP();

        mostrarMensagem(
            "🗑️ Progresso apagado!"
        );
    }
}

function pesquisar(){

    const campo =
        document.getElementById("pesquisa");

    const texto =
        campo.value.toLowerCase();

    const materia =
        document.getElementById("materia");

    const assunto =
        document.getElementById("assunto");

    if(!texto){
        return;
    }

    let encontrado = null;
    let materiaEncontrada = null;

    Object.keys(DATA.subjects).forEach(nomeMateria => {

        Object.values(DATA.subjects[nomeMateria])
            .forEach(lista => {

                lista.forEach(nomeAssunto => {

                    if(
                        nomeAssunto
                            .toLowerCase()
                            .includes(texto)
                    ){

                        encontrado = nomeAssunto;
                        materiaEncontrada = nomeMateria;
                    }

                });

            });
    });

    if(encontrado){

        materia.value = materiaEncontrada;

        carregarAssuntos();

        assunto.value = encontrado;

        mostrarComoFunciona();

    }else{

        mostrarMensagem(
            "❌ Assunto não encontrado."
        );
    }
}

document.addEventListener("DOMContentLoaded", function(){

    carregarAssuntos();

    atualizarXP();

    if(
        localStorage.getItem("ef_dark") === "true"
    ){
        document.body.classList.add("dark");
    }

    const materia =
        document.getElementById("materia");

    if(materia){

        materia.addEventListener(
            "change",
            carregarAssuntos
        );
    }

    const botoes = {

        "btnExplicacao": mostrarComoFunciona,

        "btnExercicios": mostrarExercicios,

        "btnQuiz": mostrarQuiz,

        "btnProvinha": mostrarProvinha,

        "btnDesafio": mostrarDesafio,

        "btnDesafioDificil": mostrarDesafioDificil,

        "btnSimulado": mostrarSimulado,

        "btnProvinhaMateria": mostrarProvinhaMateria,

        "btnDark": modoEscuro,

        "btnReset": resetar,

        "btnPesquisar": pesquisar
    };

    Object.keys(botoes).forEach(id => {

        const botao =
            document.getElementById(id);

        if(botao){

            botao.addEventListener(
                "click",
                botoes[id]
            );
        }
    });
});
