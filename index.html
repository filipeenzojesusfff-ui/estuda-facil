<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EstudaFácil</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#1769ff,#6c3cff);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0;
    font-size:35px;
}

header p{
    font-size:17px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.search{
    display:flex;
    gap:10px;
    margin:-10px auto 25px;
    max-width:750px;
}

.search input{
    flex:1;
    padding:15px;
    border:0;
    border-radius:14px;
    font-size:16px;
    box-shadow:0 4px 15px #0002;
}

.search button{
    border:0;
    border-radius:14px;
    padding:0 20px;
    background:#172033;
    color:white;
    font-weight:bold;
}

h2{
    margin-top:25px;
}

.anos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.ano{
    background:white;
    border:2px solid transparent;
    border-radius:16px;
    padding:18px;
    cursor:pointer;
    box-shadow:0 4px 14px #0001;
    text-align:left;
}

.ano:hover{
    border-color:#1769ff;
    transform:translateY(-2px);
}

.ano strong{
    display:block;
    font-size:18px;
}

.ano small{
    color:#667085;
}

.painel{
    background:white;
    border-radius:20px;
    padding:22px;
    margin-top:25px;
    box-shadow:0 5px 18px #0001;
}

.materias{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
}

.materia{
    background:#f7f9ff;
    border:1px solid #e1e6ef;
    padding:18px;
    border-radius:16px;
}

.materia h3{
    margin-top:0;
}

.materia p{
    color:#596579;
    line-height:1.5;
}

.botao{
    background:#1769ff;
    color:white;
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.dica{
    background:#eef5ff;
    padding:15px;
    border-radius:14px;
    margin-top:20px;
}

footer{
    text-align:center;
    padding:30px;
    color:#667085;
}

@media(max-width:600px){
    header h1{
        font-size:28px;
    }

    .search button{
        padding:0 13px;
    }
}
</style>
</head>

<body>

<header>

<h1>📚 EstudaFácil</h1>

<p>
Estude do 1º ano do Ensino Fundamental ao 3º ano do Ensino Médio!
</p>

</header>

<main class="container">

<div class="search">

<input
id="pesquisa"
type="search"
placeholder="🔎 Pesquise uma matéria..."
>

<button onclick="pesquisar()">
Buscar
</button>

</div>

<h2>🎓 Escolha seu ano</h2>

<section class="anos" id="anos"></section>

<section id="conteudo"></section>

</main>

<footer>

<b>EstudaFácil</b> 📚  
<br>
Seu lugar para estudar!

</footer>

<script>

const anos = {

"1º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Arte"
],

"2º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Arte"
],

"3º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Arte"
],

"4º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Arte"
],

"5º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Inglês",
"Arte"
],

"6º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Inglês",
"Educação Física",
"Arte"
],

"7º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Inglês",
"Educação Física",
"Arte"
],

"8º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Inglês",
"Educação Física",
"Arte"
],

"9º ano":[
"Português",
"Matemática",
"Ciências",
"História",
"Geografia",
"Inglês",
"Educação Física",
"Arte"
],

"1º ano do Ensino Médio":[
"Língua Portuguesa",
"Matemática",
"Biologia",
"Física",
"Química",
"História",
"Geografia",
"Inglês",
"Filosofia",
"Sociologia"
],

"2º ano do Ensino Médio":[
"Língua Portuguesa",
"Matemática",
"Biologia",
"Física",
"Química",
"História",
"Geografia",
"Inglês",
"Filosofia",
"Sociologia"
],

"3º ano do Ensino Médio":[
"Língua Portuguesa",
"Matemática",
"Biologia",
"Física",
"Química",
"História",
"Geografia",
"Inglês",
"Filosofia",
"Sociologia"
]

};


const assuntos = {

"Matemática":
"Operações, frações, porcentagem, equações e geometria.",

"Português":
"Leitura, interpretação, gramática, ortografia e produção de texto.",

"Língua Portuguesa":
"Interpretação, gramática, literatura e redação.",

"Ciências":
"Seres vivos, corpo humano, matéria, energia e meio ambiente.",

"História":
"Antiguidade, Idade Média, Brasil e acontecimentos do mundo.",

"Geografia":
"Mapas, relevo, clima, população e espaço geográfico.",

"Inglês":
"Vocabulário, verbos, leitura e conversação.",

"Biologia":
"Células, genética, evolução, ecologia e corpo humano.",

"Física":
"Movimento, força, energia, eletricidade e ondas.",

"Química":
"Átomos, matéria, tabela periódica e reações químicas.",

"Filosofia":
"Ética, conhecimento, pensamento e sociedade.",

"Sociologia":
"Cultura, sociedade, cidadania e trabalho.",

"Educação Física":
"Esportes, jogos, saúde, dança e atividades físicas.",

"Arte":
"Artes visuais, música, teatro, dança e cultura."

};


const icones = {

"Matemática":"➗",
"Português":"📝",
"Língua Portuguesa":"📝",
"Ciências":"🔬",
"História":"🏛️",
"Geografia":"🌎",
"Inglês":"🇬🇧",
"Biologia":"🧬",
"Física":"⚡",
"Química":"🧪",
"Filosofia":"💭",
"Sociologia":"👥",
"Educação Física":"⚽",
"Arte":"🎨"

};


const anosDiv = document.getElementById("anos");


for(let ano in anos){

    const botao = document.createElement("button");

    botao.className = "ano";

    botao.innerHTML =
    "<strong>"+ano+"</strong>" +
    "<small>"+anos[ano].length+" matérias</small>";

    botao.onclick = function(){
        mostrarAno(ano);
    };

    anosDiv.appendChild(botao);
}


function mostrarAno(ano){

    const conteudo =
    document.getElementById("conteudo");

    conteudo.innerHTML = `

    <div class="painel">

    <h2>📘 ${ano}</h2>

    <p>
    Escolha uma matéria para começar a estudar.
    </p>

    <div class="materias">

    ${anos[ano].map(materia => `

    <div class="materia">

        <h3>
        ${icones[materia] || "📚"}
        ${materia}
        </h3>

        <p>
        ${assuntos[materia] || "Conteúdos para estudar e revisar."}
        </p>

        <button
        class="botao"
        onclick="estudar('${materia}','${ano}')">

        📖 Estudar

        </button>

    </div>

    `).join("")}

    </div>

    <div class="dica">

    💡 <b>Dica:</b>
    Estude um assunto por vez e depois faça exercícios
    para testar seus conhecimentos.

    </div>

    </div>

    `;

}


function estudar(materia,ano){

    document.getElementById("conteudo").innerHTML = `

    <div class="painel">

    <button
    class="botao"
    onclick="mostrarAno('${ano}')">

    ← Voltar

    </button>

    <h2>
    ${icones[materia] || "📚"}
    ${materia}
    </h2>

    <p>
    <b>Ano:</b> ${ano}
    </p>

    <h3>📚 O que estudar?</h3>

    <p>
    ${assuntos[materia] ||
    "Revise os principais conteúdos da matéria."}
    </p>

    <div class="dica">

    🧠 <b>Área de exercícios</b>

    <p>
    Em breve você poderá responder exercícios,
    fazer quizzes e acompanhar seu progresso.
    </p>

    <button
    class="botao"
    onclick="alert('Muito bem! Continue estudando! 📚🎉')">

    Começar revisão

    </button>

    </div>

    </div>

    `;

}


function pesquisar(){

    const texto =
    document.getElementById("pesquisa")
    .value
    .toLowerCase()
    .trim();

    if(!texto){

        alert("Digite uma matéria para pesquisar.");

        return;
    }

    let resultados = [];

    for(let ano in anos){

        anos[ano].forEach(materia => {

            const assunto =
            assuntos[materia] || "";

            if(
                materia.toLowerCase().includes(texto) ||
                assunto.toLowerCase().includes(texto)
            ){

                resultados.push({
                    ano:ano,
                    materia:materia
                });

            }

        });

    }

    let html = `

    <div class="painel">

    <h2>🔎 Resultados</h2>

    `;

    if(resultados.length === 0){

        html += `

        <p>
        ❌ Nenhum resultado encontrado.
        </p>

        <p>
        Tente pesquisar por:
        <b>matemática, história, português,
        biologia ou física.</b>
        </p>

        `;

    }else{

        html += `<div class="materias">`;

        resultados.forEach(resultado => {

            html += `

            <div class="materia">

            <h3>
            ${icones[resultado.materia] || "📚"}
            ${resultado.materia}
            </h3>

            <p>
            ${resultado.ano}
            </p>

            <button
            class="botao"
            onclick="estudar(
            '${resultado.materia}',
            '${resultado.ano}'
            )">

            📖 Estudar

            </button>

            </div>

            `;

        });

        html += `</div>`;

    }

    html += `</div>`;

    document.getElementById("conteudo").innerHTML = html;

}


document
.getElementById("pesquisa")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        pesquisar();

    }

});


/* Abre o 6º ano inicialmente */

mostrarAno("6º ano");

</script>

</body>
</html>
