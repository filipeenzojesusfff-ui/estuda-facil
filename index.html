<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudaFácil V8.1</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:18px;
    margin:15px 0;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.info{
    background:#eef4ff;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.question{
    background:#f8fafc;
    padding:15px;
    margin-top:15px;
    border-radius:12px;
    border:1px solid #ddd;
}

.option{
    background:#2563eb;
    color:white;
}

.correct{
    background:#16a34a !important;
}

.wrong{
    background:#dc2626 !important;
}

#resultado{
    margin-top:15px;
    font-weight:bold;
}

.dark{
    background:#121212;
    color:#eee;
}

.dark .card{
    background:#1e1e1e;
    color:#eee;
}

.dark .info{
    background:#292929;
}

.dark .question{
    background:#242424;
    border-color:#444;
}

.progress{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
    width:0%;
}

.small{
    font-size:14px;
    opacity:.8;
}
</style>
</head>

<body>

<header>
    <h1>📚 EstudaFácil V8.1</h1>
    <p>Aprenda, pratique e prepare-se para suas provas!</p>
</header>

<div class="container">

<div class="card">

    <label>👤 Seu nome</label>
    <input id="nome" placeholder="Digite seu nome">

    <label>🎓 Ano escolar</label>
    <select id="ano">
        <option>1º ano</option>
        <option>2º ano</option>
        <option>3º ano</option>
        <option>4º ano</option>
        <option>5º ano</option>
        <option>6º ano</option>
        <option>7º ano</option>
        <option>8º ano</option>
        <option>9º ano</option>
        <option>1º Ensino Médio</option>
        <option>2º Ensino Médio</option>
        <option>3º Ensino Médio</option>
    </select>

    <label>📚 Matéria</label>
    <select id="materia" onchange="carregarAssuntos()">
        <option value="Matemática">Matemática</option>
        <option value="Português">Português</option>
        <option value="História">História</option>
        <option value="Geografia">Geografia</option>
        <option value="Ciências">Ciências</option>
        <option value="Inglês">Inglês</option>
    </select>

    <label>📖 Assunto</label>
    <select id="assunto">
        <option value="Números naturais">Números naturais</option>
        <option value="Adição e subtração">Adição e subtração</option>
        <option value="Multiplicação e divisão">Multiplicação e divisão</option>
        <option value="Frações">Frações</option>
        <option value="Números decimais">Números decimais</option>
    </select>

</div>

<div class="card">

    <h2>📊 Seu progresso</h2>

    <p>⭐ XP: <span id="xp">0</span></p>
    <p>🏆 Nível: <span id="nivel">1</span></p>
    <p>🔥 Sequência: <span id="streak">0</span> dias</p>

    <div class="progress">
        <div class="progress-bar" id="barra"></div>
    </div>

    <p class="small">Ganhe XP respondendo exercícios e quizzes.</p>

</div>

<div class="card">

    <h2>🎯 O que você quer fazer?</h2>

    <button onclick="mostrarComoFunciona()">📚 Como funciona?</button>

    <button onclick="mostrarLicao()">📖 Estudar lição</button>

    <button onclick="mostrarExercicios()">✏️ Exercícios</button>

    <button onclick="mostrarQuiz()">🧠 Quiz</button>

    <button onclick="mostrarSimulado()">🎯 Simulado</button>

    <button onclick="modoEscuro()">🌙 Modo escuro</button>

    <button onclick="limparProgresso()">🗑️ Limpar progresso</button>

</div>

<div class="card">

    <h2>🔎 Pesquisar</h2>

    <input id="pesquisa" placeholder="Digite um assunto...">

    <button onclick="pesquisar()">Pesquisar</button>

</div>

<div class="card">

    <div id="conteudo">
        <h2>👋 Bem-vindo ao EstudaFácil!</h2>
        <p>Escolha uma matéria e um assunto para começar.</p>
    </div>

</div>

</div>

<script>

var assuntos = {

    "Matemática":[
        "Números naturais",
        "Adição e subtração",
        "Multiplicação e divisão",
        "Frações",
        "Números decimais",
        "Porcentagem",
        "Equações",
        "Geometria"
    ],

    "Português":[
        "Substantivos",
        "Adjetivos",
        "Verbos",
        "Pronomes",
        "Pontuação",
        "Interpretação de texto",
        "Sinônimos e antônimos",
        "Ortografia"
    ],

    "História":[
        "Pré-História",
        "Egito Antigo",
        "Grécia Antiga",
        "Roma Antiga",
        "Idade Média",
        "Brasil Colonial",
        "Independência do Brasil",
        "República"
    ],

    "Geografia":[
        "Mapas",
        "Coordenadas geográficas",
        "Continentes",
        "Oceanos",
        "Clima",
        "Relevo",
        "População",
        "Urbanização"
    ],

    "Ciências":[
        "Seres vivos",
        "Corpo humano",
        "Sistema digestório",
        "Sistema respiratório",
        "Animais",
        "Plantas",
        "Ecossistemas",
        "Planetas"
    ],

    "Inglês":[
        "Greetings",
        "Numbers",
        "Colors",
        "Family",
        "Days of the week",
        "Months",
        "Verb to be",
        "Simple Present"
    ]

};

var xp = Number(localStorage.getItem("xp")) || 0;
var streak = Number(localStorage.getItem("streak")) || 0;

function carregarAssuntos(){

    var materia = document.getElementById("materia").value;
    var select = document.getElementById("assunto");

    select.innerHTML = "";

    var lista = assuntos[materia];

    for(var i = 0; i < lista.length; i++){

        var option = document.createElement("option");

        option.value = lista[i];
        option.textContent = lista[i];

        select.appendChild(option);
    }

}

function atualizarProgresso(){

    document.getElementById("xp").textContent = xp;

    var nivel = Math.floor(xp / 100) + 1;

    document.getElementById("nivel").textContent = nivel;

    document.getElementById("streak").textContent = streak;

    var progresso = xp % 100;

    document.getElementById("barra").style.width = progresso + "%";

    localStorage.setItem("xp",xp);
    localStorage.setItem("streak",streak);
}

function ganharXP(valor){

    xp += valor;

    atualizarProgresso();
}

function mostrarComoFunciona(){

    var materia = document.getElementById("materia").value;
    var assunto = document.getElementById("assunto").value;

    var texto = obterExplicacao(materia,assunto);

    document.getElementById("conteudo").innerHTML =
        "<h2>📚 Como funciona?</h2>" +
        "<h3>" + materia + " — " + assunto + "</h3>" +
        "<div class='info'>" + texto + "</div>";

}

function obterExplicacao(materia,assunto){

    if(assunto === "Números naturais"){
        return "Números naturais são números usados para contar. Exemplos: 0, 1, 2, 3, 4, 5...";
    }

    if(assunto === "Adição e subtração"){
        return "Adição serve para juntar quantidades. Subtração serve para retirar ou descobrir a diferença entre quantidades.";
    }

    if(assunto === "Multiplicação e divisão"){
        return "Multiplicação pode representar várias adições iguais. Divisão serve para repartir uma quantidade em partes iguais.";
    }

    if(assunto === "Frações"){
        return "Uma fração representa partes de um todo. O número de cima é o numerador e o de baixo é o denominador.";
    }

    if(assunto === "Números decimais"){
        return "Números decimais possuem uma parte inteira e uma parte decimal. Exemplo: 2,5.";
    }

    if(assunto === "Porcentagem"){
        return "Porcentagem representa uma parte de 100. Por exemplo, 50% significa 50 de cada 100.";
    }

    if(assunto === "Substantivos"){
        return "Substantivos são palavras usadas para nomear pessoas, animais, objetos, lugares, sentimentos e outras coisas.";
    }

    if(assunto === "Adjetivos"){
        return "Adjetivos são palavras que caracterizam ou dão uma qualidade a um substantivo.";
    }

    if(assunto === "Verbos"){
        return "Verbos indicam ações, estados ou acontecimentos. Exemplos: correr, estudar, ser e estar.";
    }

    if(assunto === "Pré-História"){
        return "A Pré-História é o período anterior ao surgimento da escrita. Ela inclui períodos como o Paleolítico e o Neolítico.";
    }

    if(assunto === "Egito Antigo"){
        return "O Egito Antigo desenvolveu-se principalmente às margens do rio Nilo e ficou conhecido por suas pirâmides, faraós e cultura.";
    }

    if(assunto === "Mapas"){
        return "Mapas são representações de lugares da superfície terrestre. Eles podem mostrar cidades, países, rios, estradas e muito mais.";
    }

    if(assunto === "Coordenadas geográficas"){
        return "Coordenadas geográficas usam latitude e longitude para localizar pontos na superfície da Terra.";
    }

    if(assunto === "Seres vivos"){
        return "Seres vivos possuem características como nascimento, crescimento, reprodução e morte.";
    }

    if(assunto === "Corpo humano"){
        return "O corpo humano é formado por vários sistemas que trabalham juntos, como os sistemas digestório, respiratório e circulatório.";
    }

    if(assunto === "Greetings"){
        return "Greetings são cumprimentos em inglês. Exemplos: Hello, Hi, Good morning e Good afternoon.";
    }

    if(assunto === "Numbers"){
        return "Numbers são os números em inglês. Exemplos: one, two, three, four e five.";

    }

    return "Este assunto será explicado em breve pelo EstudaFácil. Continue estudando e praticando!";

}

function mostrarLicao(){

    var materia = document.getElementById("materia").value;
    var assunto = document.getElementById("assunto").value;

    document.getElementById("conteudo").innerHTML =
        "<h2>📖 Lição</h2>" +
        "<h3>" + materia + " — " + assunto + "</h3>" +
        "<div class='info'>" +
        obterExplicacao(materia,assunto) +
        "</div>" +
        "<p>💡 Dica: leia a explicação com atenção e depois faça alguns exercícios.</p>";

}

function criarQuestao(pergunta,opcoes,correta){

    var html = "";

    html += "<div class='question'>";
    html += "<h3>" + pergunta + "</h3>";

    for(var i = 0; i < opcoes.length; i++){

        html += "<button class='option' onclick=\"responder(this," +
        (i === correta ? "true" : "false") +
        ")\">" + opcoes[i] + "</button>";

    }

    html += "</div>";

    return html;
}

function responder(botao,correto){

    if(correto){

        botao.classList.add("correct");
        botao.textContent += " ✅";

        ganharXP(10);

    }else{

        botao.classList.add("wrong");
        botao.textContent += " ❌";

    }

}

function mostrarExercicios(){

    var assunto = document.getElementById("assunto").value;

    var html = "<h2>✏️ Exercícios — " + assunto + "</h2>";

    if(assunto === "Números naturais"){

        html += criarQuestao(
            "Qual número vem depois do 9?",
            ["8","10","11"],
            1
        );

        html += criarQuestao(
            "Qual é o maior número?",
            ["15","9","12"],
            0
        );

    }else if(assunto === "Adição e subtração"){

        html += criarQuestao(
            "Quanto é 25 + 15?",
            ["30","40","50"],
            1
        );

        html += criarQuestao(
            "Quanto é 50 - 20?",
            ["20","30","40"],
            1
        );

    }else if(assunto === "Multiplicação e divisão"){

        html += criarQuestao(
            "Quanto é 5 × 5?",
            ["20","25","30"],
            1
        );

        html += criarQuestao(
            "Quanto é 20 ÷ 4?",
            ["4","5","6"],
            1
        );

    }else if(assunto === "Frações"){

        html += criarQuestao(
            "Qual fração representa uma parte de duas?",
            ["1/2","2/2","1/3"],
            0
        );

        html += criarQuestao(
            "Na fração 3/4, qual é o numerador?",
            ["3","4","7"],
            0
        );

    }else if(assunto === "Números decimais"){

        html += criarQuestao(
            "Qual número é maior?",
            ["2,5","2,3","2,1"],
            0
        );

        html += criarQuestao(
            "Quanto é 1,5 + 1,5?",
            ["2","3","4"],
            1
        );

    }else if(assunto === "Substantivos"){

        html += criarQuestao(
            "Qual palavra é um substantivo?",
            ["correr","casa","bonito"],
            1
        );

        html += criarQuestao(
            "Qual palavra nomeia uma pessoa?",
            ["menino","rápido","correr"],
            0
        );

    }else if(assunto === "Adjetivos"){

        html += criarQuestao(
            "Qual palavra é um adjetivo?",
            ["bonito","casa","correr"],
            0
        );

        html += criarQuestao(
            "Em 'cachorro grande', qual é o adjetivo?",
            ["cachorro","grande","o"],
            1
        );

    }else if(assunto === "Verbos"){

        html += criarQuestao(
            "Qual palavra é um verbo?",
            ["correr","azul","casa"],
            0
        );

        html += criarQuestao(
            "Qual palavra indica uma ação?",
            ["estudar","bonito","mesa"],
            0
        );

    }else if(assunto === "Greetings"){

        html += criarQuestao(
            "O que significa 'Hello'?",
            ["Tchau","Olá","Obrigado"],
            1
        );

        html += criarQuestao(
            "O que significa 'Good morning'?",
            ["Boa noite","Bom dia","Boa tarde"],
            1
        );

    }else{

        html += "<div class='info'>";
        html += "Ainda estamos preparando exercícios específicos para este assunto. 📚";
        html += "</div>";

    }

    document.getElementById("conteudo").innerHTML = html;

}

function mostrarQuiz(){

    var assunto = document.getElementById("assunto").value;

    document.getElementById("conteudo").innerHTML =
        "<h2>🧠 Quiz</h2>" +
        "<p>Você está fazendo um quiz sobre:</p>" +
        "<h3>" + assunto + "</h3>" +
        "<div class='info'>" +
        "Responda às questões e tente conseguir o máximo de XP!" +
        "</div>";

    ganharXP(5);

}

function mostrarSimulado(){

    var assunto = document.getElementById("assunto").value;

    document.getElementById("conteudo").innerHTML =
        "<h2>🎯 Simulado</h2>" +
        "<h3>Simulado de " + assunto + "</h3>" +
        "<p>Prepare-se como se estivesse fazendo uma prova!</p>" +
        "<button onclick='mostrarExercicios()'>Começar simulado</button>";

}

function pesquisar(){

    var texto = document.getElementById("pesquisa").value.toLowerCase();

    var encontrado = false;

    for(var materia in assuntos){

        for(var i = 0; i < assuntos[materia].length; i++){

            if(assuntos[materia][i].toLowerCase().indexOf(texto) !== -1){

                encontrado = true;

                document.getElementById("conteudo").innerHTML =
                    "<h2>🔎 Resultado da pesquisa</h2>" +
                    "<p>Encontramos:</p>" +
                    "<h3>" + assuntos[materia][i] + "</h3>" +
                    "<p>📚 Matéria: " + materia + "</p>";

                return;
            }

        }

    }

    if(!encontrado){

        document.getElementById("conteudo").innerHTML =
            "<h2>❌ Assunto não encontrado</h2>" +
            "<p>Tente pesquisar outro assunto.</p>";

    }

}

function modoEscuro(){

    document.body.classList.toggle("dark");

}

function limparProgresso(){

    var confirmar = confirm("Tem certeza que deseja apagar seu progresso?");

    if(confirmar){

        xp = 0;
        streak = 0;

        localStorage.removeItem("xp");
        localStorage.removeItem("streak");

        atualizarProgresso();

        alert("Progresso apagado!");

    }

}

/* INICIALIZAÇÃO */

carregarAssuntos();
atualizarProgresso();

</script>

</body>
</html>
