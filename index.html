<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#222;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:28px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:10px 0 0;
  font-size:18px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:22px;
  margin:16px 0;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:27px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
  font-size:17px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:13px;
  font-size:17px;
  background:white;
}

button{
  width:100%;
  padding:16px;
  margin-top:11px;
  border:0;
  border-radius:13px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.info{
  background:#eef4ff;
  padding:18px;
  border-radius:14px;
  line-height:1.65;
  font-size:17px;
}

.question{
  background:#f8fafc;
  padding:18px;
  margin-top:16px;
  border-radius:15px;
  border:1px solid #ddd;
}

.question h3{
  margin-top:0;
}

.correct{
  background:#16a34a !important;
}

.wrong{
  background:#dc2626 !important;
}

.progress{
  height:18px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:.3s;
}

.xpbox{
  font-size:18px;
  line-height:1.8;
}

.small{
  font-size:14px;
  opacity:.75;
}

.resultado{
  margin-top:15px;
  padding:16px;
  background:#eef4ff;
  border-radius:13px;
  font-size:18px;
  font-weight:bold;
}

.dark{
  background:#111;
  color:#eee;
}

.dark .card{
  background:#1e1e1e;
}

.dark input,
.dark select{
  background:#292929;
  color:white;
  border-color:#555;
}

.dark .info,
.dark .resultado{
  background:#292929;
}

.dark .question{
  background:#242424;
  border-color:#444;
}

footer{
  text-align:center;
  padding:30px;
  opacity:.7;
}

.voltar{
  background:#555;
}

</style>
</head>

<!-- PERFIL -->

<div class="card">

<h2>👤 Seu perfil</h2>

<label>Seu nome</label>

<input
id="nome"
placeholder="Digite seu nome"
oninput="salvarNome()"
>

<label>🎓 Ano escolar</label>

<select id="ano">

<option>1º ano</option>
<option>2º ano</option>
<option>3º ano</option>
<option>4º ano</option>
<option>5º ano</option>
<option>6º ano</option>
<option>7º ano</option>
<option>8º ano</option>
<option>9º ano</option>
<option>1º Ensino Médio</option>
<option>2º Ensino Médio</option>
<option>3º Ensino Médio</option>

</select>

<label>📚 Matéria</label>

<option value="Português">Português</option>
<option value="História">História</option>
<option value="Geografia">Geografia</option>
<option value="Ciências">Ciências</option>
<option value="Inglês">Inglês</option>

</select>

<label>📖 Assunto</label>

<select id="assunto">
<option value="Números naturais">Números naturais</option>
</select>

</div>


<!-- PROGRESSO -->

<div class="card">

<h2>🏆 Seu progresso</h2>

<div class="xpbox">

⭐ XP: <span id="xp">0</span>

<br>

🏆 Nível: <span id="nivel">1</span>

<br>

🔥 Sequência: <span id="streak">0</span>

</div>

<div class="progress">
<div class="progress-bar" id="barra"></div>
</div>

<p class="small">
A cada 100 XP você sobe de nível.
</p>

</div>


<!-- AÇÕES -->

<div class="card">

<h2>🎯 Estudar</h2>

<button onclick="mostrarComoFunciona()">
📚 Como funciona?
</button>

<button onclick="mostrarLicao()">
📖 Estudar lição
</button>

<button onclick="mostrarExercicios()">
✏️ Exercícios
</button>

<button onclick="mostrarQuiz()">
🧠 Quiz
</button>

<button onclick="mostrarSimulado()">
🎯 Simulado
</button>

<button onclick="modoEscuro()">
🌙 Modo escuro
</button>

<button onclick="limparProgresso()">
🗑️ Limpar progresso
</button>

</div>


<!-- PESQUISA -->

<div class="card">

<h2>🔎 Pesquisar</h2>

<input
id="pesquisa"
placeholder="Ex.: frações, verbos, Egito..."
>

<button onclick="pesquisar()">
🔎 Pesquisar
</button>

</div>


<!-- CONTEÚDO -->

<div class="card">

<div id="conteudo">

<h2>👋 Bem-vindo!</h2>

<p>
Escolha uma matéria e um assunto para começar.
</p>

</div>

</div>

</div>

<footer>
