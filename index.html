</p>

<label>📚 Matéria</label>

<option value="Geografia">Geografia</option>

<option value="Ciências">Ciências</option>

<option value="Inglês">Inglês</option>

<option value="Educação Física">Educação Física</option>

<option value="Artes">Artes</option>

</select>


<button id="explicacao">

📖 Explicação da matéria

</button>


<button id="simulado" class="roxo">

📝 Simulado — 15 questões

</button>

</div>


<!-- CONTEÚDO -->

========================= */

let xp = Number(localStorage.getItem("estudaXP") || 0);

let nome = localStorage.getItem("estudaNome") || "";

const campoNome = document.getElementById("nome");

campoNome.value = nome;


function atualizarPerfil(){

document.getElementById("xp").textContent = xp;

document.getElementById("nivel").textContent =
Math.floor(xp / 100) + 1;

if(nome){

document.getElementById("boasVindas").textContent =
"Olá, " + nome + "! 👋";

}else{

document.getElementById("boasVindas").textContent = "";

}

}


campoNome.addEventListener("input",function(){

nome = this.value;

localStorage.setItem("estudaNome",nome);

atualizarPerfil();

});


function ganharXP(valor){

xp += valor;

localStorage.setItem("estudaXP",xp);

atualizarPerfil();

}


atualizarPerfil();

/* =========================

========================= */

document.getElementById("explicacao").onclick = function(){

let ano = document.getElementById("ano").value;

let materia = document.getElementById("materia").value;

if(!ano || !materia){

document.getElementById("conteudo").innerHTML = `

<div class="card">

<h2>⚠️ Escolha o ano e a matéria primeiro.</h2>

</div>

`;

return;

}


document.getElementById("conteudo").innerHTML = `

<div class="card">

<h2>📖 ${materia} — ${ano}</h2>

<p>${explicacoes[materia]}</p>

<h3>🎯 Como estudar</h3>

<p>
Leia a explicação, tente lembrar o que aprendeu
e depois faça o simulado de 15 questões.
</p>

</div>

`;

};


/* =========================
   SIMULADO
========================= */

document.getElementById("simulado").onclick = function(){

let ano = document.getElementById("ano").value;

let materia = document.getElementById("materia").value;

if(!ano || !materia){

document.getElementById("conteudo").innerHTML = `

<div class="card">

<h2>⚠️ Escolha o ano e a matéria primeiro.</h2>

</div>

`;

return;

}


let lista = perguntas[materia];

let acertos = 0;

let container = document.getElementById("conteudo");

container.innerHTML = `

<div class="card">

<h2>📝 Simulado de ${materia}</h2>

<p>${ano} • 15 questões</p>

<p>⭐ Cada acerto vale 10 XP.</p>

</div>

`;


lista.forEach(function(q,numero){

let card = document.createElement("div");

card.className = "card questao";

let titulo = document.createElement("h3");

titulo.textContent =
(numero + 1) + ". " + q[0];

card.appendChild(titulo);


q[1].forEach(function(opcao,index){

let botao = document.createElement("button");

botao.className = "resposta";

botao.textContent = opcao;


botao.onclick = function(){

if(card.dataset.respondida === "sim"){
return;
}

card.dataset.respondida = "sim";


let botoes =
card.querySelectorAll("button");


botoes.forEach(function(b){
b.disabled = true;
});


if(index === q[2]){

botao.classList.add("certa");

acertos++;

ganharXP(10);

mensagem.textContent =
"🎉 Acertou! +10 XP";

}else{

botao.classList.add("errada");

botoes[q[2]].classList.add("certa");

mensagem.textContent =
"❌ Errou! A resposta correta ficou verde.";

}

};


card.appendChild(botao);

});


let mensagem = document.createElement("p");

mensagem.className = "pequeno";

card.appendChild(mensagem);

container.appendChild(card);

});


let final = document.createElement("div");

final.className = "card";

final.innerHTML = `

<h2>🏆 Resultado</h2>

<button id="verResultado" class="verde">
Ver minha nota
</button>

<div id="resultado"></div>

`;

container.appendChild(final);


document.getElementById("verResultado").onclick = function(){

let nota = (acertos / 15) * 10;

document.getElementById("resultado").innerHTML = `

<div class="resultado">

<p>Você acertou ${acertos} de 15!</p>

<p>📊 Nota: ${nota.toFixed(1)} / 10</p>

<p>⭐ XP ganho: ${acertos * 10}</p>

</div>

`;

};

};
