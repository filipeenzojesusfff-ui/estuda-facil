<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EstudaFácil</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
    transition: 0.3s;
}

header {
    background: #2563eb;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    margin: 6px 4px 6px 0;
    font-size: 15px;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.button-green {
    background: #16a34a;
}

.button-orange {
    background: #ea580c;
}

.button-purple {
    background: #7c3aed;
}

.button-dark {
    background: #374151;
}

.button-red {
    background: #dc2626;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    background: #eef4ff;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 23px;
    margin-bottom: 5px;
}

.progress {
    width: 100%;
    height: 15px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: 0.4s;
}

.actions {
    display: flex;
    flex-wrap: wrap;
}

#conteudo {
    min-height: 100px;
    line-height: 1.6;
}

.question {
    background: #f8fafc;
    border-radius: 12px;
    padding: 15px;
    margin: 12px 0;
}

.answer-result {
    font-weight: bold;
    margin-top: 10px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-box input {
    flex: 1;
}

.search-box button {
    margin: 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
}

/* MODO ESCURO */

body.dark {
    background: #111827;
    color: #f3f4f6;
}

body.dark .card {
    background: #1f2937;
}

body.dark input,
body.dark select {
    background: #374151;
    color: white;
    border-color: #4b5563;
}

body.dark .stat {
    background: #374151;
}

body.dark .question {
    background: #374151;
}

body.dark footer {
    color: #aaa;
}

@media (max-width: 650px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    header h1 {
        font-size: 25px;
    }

    .search-box {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 EstudaFácil</h1>
    <p>Aprenda, pratique e prepare-se para suas provas!</p>
</header>

<div class="container">

    <div class="card">
        <h2>👤 Seu perfil</h2>

        <label>Seu nome</label>
        <input id="nome" type="text" placeholder="Digite seu nome">

        <label>Ano escolar</label>

        <select id="ano">
            <option value="1º ano">1º ano</option>
            <option value="2º ano">2º ano</option>
            <option value="3º ano">3º ano</option>
            <option value="4º ano">4º ano</option>
            <option value="5º ano">5º ano</option>
            <option value="6º ano">6º ano</option>
            <option value="7º ano">7º ano</option>
            <option value="8º ano">8º ano</option>
            <option value="9º ano">9º ano</option>
            <option value="1º ano do Ensino Médio">1º ano do Ensino Médio</option>
            <option value="2º ano do Ensino Médio">2º ano do Ensino Médio</option>
            <option value="3º ano do Ensino Médio">3º ano do Ensino Médio</option>
        </select>
    </div>


    <div class="card">
        <h2>📊 Seu progresso</h2>

        <div class="stats">

            <div class="stat">
                <strong id="xp">0</strong>
                XP
            </div>

            <div class="stat">
                <strong id="nivel">1</strong>
                Nível
            </div>

            <div class="stat">
                <strong id="sequencia">0</strong>
                🔥 Dias
            </div>

            <div class="stat">
                <strong id="meta">100</strong>
                Meta XP
            </div>

        </div>

        <br>

        <div class="progress">
            <div class="progress-bar" id="barra"></div>
        </div>
    </div>


    <div class="card">

        <h2>📚 Escolha o que estudar</h2>

        <label>Matéria</label>

        <select id="materia">

            <option value="Matemática">➗ Matemática</option>
            <option value="Português">📖 Português</option>
            <option value="História">🏛️ História</option>
            <option value="Geografia">🌎 Geografia</option>
            <option value="Ciências">🔬 Ciências</option>
            <option value="Inglês">🇺🇸 Inglês</option>

        </select>


        <label>Assunto</label>

        <select id="assunto">
            <option value="">Carregando assuntos...</option>
        </select>


        <div class="actions">

            <button onclick="mostrarLicao()">
                📖 Estudar lição
            </button>

            <button class="button-green" onclick="mostrarExercicios()">
                ✏️ Exercícios
            </button>

            <button class="button-purple" onclick="mostrarQuiz()">
                🧠 Quiz
            </button>

            <button class="button-orange" onclick="mostrarSimulado()">
                🎯 Simulado
            </button>

            <button class="button-dark" onclick="modoEscuro()">
                🌙 Modo escuro
            </button>

            <button class="button-red" onclick="zerarProgresso()">
                🗑️ Limpar progresso
            </button>

        </div>

    </div>


    <div class="card">

        <h2>🔎 Procurar assunto</h2>

        <div class="search-box">

            <input
                id="pesquisa"
                type="text"
                placeholder="Ex.: frações, verbos, Brasil..."
            >

            <button onclick="pesquisar()">
                🔍 Pesquisar
            </button>

        </div>

    </div>


    <div class="card">

        <h2 id="tituloConteudo">📚 Conteúdo</h2>

        <div id="conteudo">
            Escolha uma matéria e um assunto para começar.
        </div>

    </div>

</div>


<footer>
    📚 EstudaFácil — Estude de forma simples e gratuita.
</footer>


<script>

/* =========================
   ASSUNTOS
========================= */

const assuntos = {

    "Matemática": [
        "Números naturais",
        "Adição e subtração",
        "Multiplicação e divisão",
        "Frações",
        "Números decimais",
        "Porcentagem",
        "Razão e proporção",
        "Regra de três",
        "Potenciação",
        "Radiciação",
        "Equações",
        "Geometria",
        "Perímetro",
        "Área",
        "Média"
    ],

    "Português": [
        "Alfabeto",
        "Substantivos",
        "Adjetivos",
        "Verbos",
        "Pronomes",
        "Advérbios",
        "Pontuação",
        "Acentuação",
        "Ortografia",
        "Interpretação de texto",
        "Sujeito e predicado",
        "Sinônimos e antônimos"
    ],

    "História": [
        "Pré-História",
        "Antiguidade",
        "Egito Antigo",
        "Grécia Antiga",
        "Roma Antiga",
        "Idade Média",
        "Grandes Navegações",
        "Brasil Colônia",
        "Independência do Brasil",
        "Império do Brasil",
        "República",
        "Revolução Industrial"
    ],

    "Geografia": [
        "Planeta Terra",
        "Continentes",
        "Oceanos",
        "Mapas",
        "Coordenadas geográficas",
        "Latitude e longitude",
        "Clima",
        "Relevo",
        "Vegetação",
        "População",
        "Urbanização",
        "Globalização"
    ],

    "Ciências": [
        "Seres vivos",
        "Corpo humano",
        "Células",
        "Sistema digestório",
        "Sistema respiratório",
        "Sistema circulatório",
        "Animais",
        "Plantas",
        "Ecossistemas",
        "Cadeia alimentar",
        "Água",
        "Sistema Solar"
    ],

    "Inglês": [
        "Greetings",
        "Numbers",
        "Colors",
        "Family",
        "School",
        "Days of the week",
        "Months",
        "Verb to be",
        "Simple Present",
        "Pronouns",
        "Animals",
        "Food"
    ]

};


/* =========================
   ELEMENTOS
========================= */

const materia = document.getElementById("materia");
const assunto = document.getElementById("assunto");
const ano = document.getElementById("ano");
const nome = document.getElementById("nome");

const xpElemento = document.getElementById("xp");
const nivelElemento = document.getElementById("nivel");
const sequenciaElemento = document.getElementById("sequencia");
const barra = document.getElementById("barra");

const conteudo = document.getElementById("conteudo");
const tituloConteudo = document.getElementById("tituloConteudo");


/* =========================
   CARREGAR ASSUNTOS
========================= */

function carregarAssuntos() {

    const materiaEscolhida = materia.value;

    assunto.innerHTML = "";

    const lista = assuntos[materiaEscolhida];

    if (!lista || lista.length === 0) {

        const opcao = document.createElement("option");

        opcao.textContent = "Nenhum assunto encontrado";

        assunto.appendChild(opcao);

        return;
    }

    lista.forEach(function(item) {

        const opcao = document.createElement("option");

        opcao.value = item;
        opcao.textContent = item;

        assunto.appendChild(opcao);

    });

}


/* =========================
   XP
========================= */

let xp = Number(localStorage.getItem("estudaXP")) || 0;

let sequencia =
    Number(localStorage.getItem("estudaSequencia")) || 0;


function atualizarProgresso() {

    const nivel = Math.floor(xp / 100) + 1;

    xpElemento.textContent = xp;

    nivelElemento.textContent = nivel;

    sequenciaElemento.textContent = sequencia;

    const progresso = xp % 100;

    barra.style.width = progresso + "%";

}


function ganharXP(valor) {

    xp += valor;

    localStorage.setItem("estudaXP", xp);

    atualizarProgresso();

}


/* =========================
   PERFIL
========================= */

nome.value =
    localStorage.getItem("estudaNome") || "";

nome.addEventListener("input", function() {

    localStorage.setItem(
        "estudaNome",
        nome.value
    );

});


/* =========================
   LIÇÃO
========================= */

function mostrarLicao() {

    const materiaEscolhida = materia.value;

    const assuntoEscolhido = assunto.value;

    const anoEscolhido = ano.value;

    tituloConteudo.textContent =
        "📖 Lição — " + assuntoEscolhido;

    let texto = "";

    if (assuntoEscolhido === "Frações") {

        texto =
        "<h3>➗ Frações</h3>" +
        "<p>Uma fração representa uma parte de um todo.</p>" +
        "<p>Ela possui numerador e denominador.</p>" +
        "<p>Exemplo: em 3/4, o número 3 é o numerador e o 4 é o denominador.</p>";

    }

    else if (assuntoEscolhido === "Porcentagem") {

        texto =
        "<h3>💯 Porcentagem</h3>" +
        "<p>Porcentagem representa uma parte de 100.</p>" +
        "<p>50% significa 50 de cada 100.</p>" +
        "<p>Exemplo: 50% de 100 é 50.</p>";

    }

    else if (assuntoEscolhido === "Verbos") {

        texto =
        "<h3>📖 Verbos</h3>" +
        "<p>Verbos são palavras que indicam ações, estados ou fenômenos.</p>" +
        "<p>Exemplos: correr, estudar, brincar, ser e estar.</p>";

    }

    else if (assuntoEscolhido === "Latitude e longitude") {

        texto =
        "<h3>🌎 Latitude e longitude</h3>" +
        "<p>Latitude indica a posição ao norte ou ao sul do Equador.</p>" +
        "<p>Longitude indica a posição a leste ou oeste do Meridiano de Greenwich.</p>";

    }

    else if (assuntoEscolhido === "Sistema Solar") {

        texto =
        "<h3>🪐 Sistema Solar</h3>" +
        "<p>O Sistema Solar é formado pelo Sol e pelos corpos celestes que orbitam ao seu redor.</p>" +
        "<p>Entre os planetas estão Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano e Netuno.</p>";

    }

    else {

        texto =
        "<h3>📚 " + assuntoEscolhido + "</h3>" +
        "<p>Você está estudando <strong>" +
        assuntoEscolhido +
        "</strong> na matéria de <strong>" +
        materiaEscolhida +
        "</strong>.</p>" +
        "<p>Este conteúdo é destinado ao " +
        anoEscolhido +
        ".</p>" +
        "<p>Leia o assunto, faça exercícios e depois tente o quiz para ganhar XP!</p>";

    }

    conteudo.innerHTML = texto;

    ganharXP(10);

}


/* =========================
   EXERCÍCIOS
========================= */

function mostrarExercicios() {

    tituloConteudo.textContent =
        "✏️ Exercícios — " + assunto.value;

    conteudo.innerHTML =

        "<h3>Questão 1</h3>" +

        "<div class='question'>" +
        "<p>Quanto é 5 + 5?</p>" +

        "<button onclick='responder(this, true)'>10</button>" +
        "<button onclick='responder(this, false)'>15</button>" +
        "<button onclick='responder(this, false)'>20</button>" +

        "<div class='answer-result'></div>" +
        "</div>" +


        "<h3>Questão 2</h3>" +

        "<div class='question'>" +
        "<p>Quanto é 10 × 2?</p>" +

        "<button onclick='responder(this, true)'>20</button>" +
        "<button onclick='responder(this, false)'>12</button>" +
        "<button onclick='responder(this, false)'>30</button>" +

        "<div class='answer-result'></div>" +
        "</div>";

}


/* =========================
   RESPONDER
========================= */

function responder(botao, correto) {

    const questao =
        botao.parentElement;

    const resultado =
        questao.querySelector(".answer-result");

    if (questao.dataset.respondida === "sim") {
        return;
    }

    questao.dataset.respondida = "sim";

    if (correto) {

        resultado.textContent =
            "✅ Acertou! +10 XP";

        ganharXP(10);

    } else {

        resultado.textContent =
            "❌ Essa não foi a resposta correta.";

    }

}


/* =========================
   QUIZ
========================= */

function mostrarQuiz() {

    tituloConteudo.textContent =
        "🧠 Quiz — " + assunto.value;

    conteudo.innerHTML =

        "<h3>Você está pronto?</h3>" +

        "<div class='question'>" +

        "<p><strong>Quanto é 100 ÷ 10?</strong></p>" +

        "<button onclick='responder(this, true)'>10</button>" +

        "<button onclick='responder(this, false)'>5</button>" +

        "<button onclick='responder(this, false)'>20</button>" +

        "<div class='answer-result'></div>" +

        "</div>";

}


/* =========================
   SIMULADO
========================= */

function mostrarSimulado() {

    tituloConteudo.textContent =
        "🎯 Simulado";

    conteudo.innerHTML =

        "<h3>Simulado EstudaFácil</h3>" +

        "<div class='question'>" +
        "<p>1. Quanto é 7 + 8?</p>" +
        "<button onclick='responder(this, true)'>15</button>" +
        "<button onclick='responder(this, false)'>14</button>" +
        "<button onclick='responder(this, false)'>16</button>" +
        "<div class='answer-result'></div>" +
        "</div>" +


        "<div class='question'>" +
        "<p>2. Qual planeta é conhecido como planeta vermelho?</p>" +
        "<button onclick='responder(this, true)'>Marte</button>" +
        "<button onclick='responder(this, false)'>Terra</button>" +
        "<button onclick='responder(this, false)'>Júpiter</button>" +
        "<div class='answer-result'></div>" +
        "</div>" +


        "<div class='question'>" +
        "<p>3. Qual é a capital do Brasil?</p>" +
        "<button onclick='responder(this, true)'>Brasília</button>" +
        "<button onclick='responder(this, false)'>São Paulo</button>" +
        "<button onclick='responder(this, false)'>Rio de Janeiro</button>" +
        "<div class='answer-result'></div>" +
        "</div>";

}


/* =========================
   PESQUISA
========================= */

function pesquisar() {

    const texto =
        document.getElementById("pesquisa")
        .value
        .toLowerCase()
        .trim();

    if (texto === "") {

        alert("Digite um assunto para pesquisar.");

        return;
    }

    for (const materiaNome in assuntos) {

        const lista =
            assuntos[materiaNome];

        for (let i = 0; i < lista.length; i++) {

            if (
                lista[i]
                .toLowerCase()
                .includes(texto)
            ) {

                materia.value = materiaNome;

                carregarAssuntos();

                assunto.value = lista[i];

                mostrarLicao();

                return;
            }

        }

    }

    tituloConteudo.textContent =
        "🔎 Pesquisa";

    conteudo.innerHTML =
        "<p>❌ Assunto não encontrado.</p>" +
        "<p>Tente pesquisar outro termo.</p>";

}


/* =========================
   MODO ESCURO
========================= */

function modoEscuro() {

    document.body.classList.toggle("dark");

    const ativado =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "estudaDark",
        ativado
    );

}


/* =========================
   LIMPAR PROGRESSO
========================= */

function zerarProgresso() {

    const confirmar =
        confirm(
            "Tem certeza que deseja apagar seu XP e sua sequência?"
        );

    if (!confirmar) {
        return;
    }

    xp = 0;

    sequencia = 0;

    localStorage.removeItem("estudaXP");

    localStorage.removeItem("estudaSequencia");

    atualizarProgresso();

}


/* =========================
   INICIAR
========================= */

materia.addEventListener(
    "change",
    carregarAssuntos
);


carregarAssuntos();

atualizarProgresso();


if (
    localStorage.getItem("estudaDark")
    === "true"
) {

    document.body.classList.add("dark");

}

</script>

</body>
  </html>
