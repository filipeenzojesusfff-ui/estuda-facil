📝 Simulado de 15 questões

</button>

let xp = Number(localStorage.getItem("estudaXP") || 0);

let nome = localStorage.getItem("estudaNome") || "";

const nomeInput = document.getElementById("nome");

nomeInput.value = nome;


function atualizarPerfil(){

document.getElementById("xp").textContent = xp;

document.getElementById("nivel").textContent =
Math.floor(xp / 100) + 1;

if(nome){

document.getElementById("boasVindas").textContent =
"Olá, " + nome + "! 👋";

}else{

document.getElementById("boasVindas").textContent = "";

}

}


nomeInput.addEventListener("input",function(){

nome = this.value;

localStorage.setItem("estudaNome",nome);

atualizarPerfil();

});


function ganharXP(valor){

xp += valor;

localStorage.setItem("estudaXP",xp);

atualizarPerfil();

}


atualizarPerfil();

}

/* ==================================================
   CARREGAR ASSUNTOS
================================================== */

const anoSelect = document.getElementById("ano");

const materiaSelect = document.getElementById("materia");

const assuntoSelect = document.getElementById("assunto");


function carregarAssuntos(){

assuntoSelect.innerHTML =
'<option value="">Escolha um assunto</option>';

const ano = anoSelect.value;

const materia = materiaSelect.value;

if(!ano || !materia){

return;

}

const lista = assuntos[materia][ano] || [];

lista.forEach(function(item){

const option = document.createElement("option");

option.value = item;

option.textContent = item;

assuntoSelect.appendChild(option);

});

}


anoSelect.addEventListener("change",carregarAssuntos);

materiaSelect.addEventListener("change",carregarAssuntos);

</div>

`;

return;

<p class="pequeno">

</p>

${pegarExplicacao(assunto)}

</div>

<div class="exemplo">

};
