*{

body{

header{

margin:0;
font-size:30px;

header p{

.container{

.card{

h2{
margin-top:0;
}

label{

input,

padding:14px;

button{

padding:15px;
margin-top:10px;
border:0;

color:white;
font-size:17px;

}

button:active{
transform:scale(.98);
}

.info{
background:#eef4ff;
padding:17px;
border-radius:13px;
line-height:1.6;
font-size:17px;
}

.question{
background:#f8fafc;
padding:17px;
margin-top:15px;
border-radius:14px;

}

.question button{
background:#2563eb;
}

.correct{
background:#16a34a !important;

.wrong{
background:#dc2626 !important;
}

.progress{
height:18px;
background:#ddd;

.progress-bar{
height:100%;

.xpbox{

}

.small{

.dark{
background:#111;
color:#eee;
}

.dark .card{
background:#1e1e1e;
}

.dark input,
.dark select{
background:#292929;
color:white;
border-color:#555;
}

.dark .info{
background:#292929;
}

.dark .question{
background:#242424;
border-color:#444;
}

footer{
text-align:center;
padding:25px;
opacity:.7;
}

<option>3º ano</option>
<option>4º ano</option>
<option>5º ano</option>
<option>6º ano</option>

<option value="Ciências">Ciências</option>

<label>📖 Assunto</label>

<select id="assunto"></select>

</div>



<!-- PROGRESSO -->

<div class="card">

<h2>🏆 Seu progresso</h2>

<div class="xpbox">

⭐ XP: <span id="xp">0</span>

<br>

🏆 Nível: <span id="nivel">1</span>

<br>

🔥 Sequência: <span id="streak">0</span>

</div>

<div class="progress">

<div
class="progress-bar"
id="barra"
></div>

</div>

<p class="small">

A cada 100 XP você sobe de nível.

</p>

</div>



<!-- AÇÕES -->

<div class="card">

<h2>🎯 Estudar</h2>

<button onclick="mostrarComoFunciona()">
📚 Como funciona?
</button>

<button onclick="mostrarLicao()">
📖 Estudar lição
</button>

<button onclick="mostrarExercicios()">

</button>

<button onclick="mostrarQuiz()">

</button>

<button onclick="modoEscuro()">

</button>

<button onclick="limparProgresso()">

</div>

</div>
