<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;

}

header{
    background:#2563eb;
    color:white;
    padding:20px;

}

header h1{

}

.container{
    max-width:900px;

    padding:20px;

.card{
    background:white;
    border-radius:15px;
    padding:20px;

}

select,button{
    width:100%;

    margin-top:10px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{

}

.resposta{
    background:#e5e7eb;
    color:#111827;
}

.resposta.certa{
    background:#22c55e;
    color:white;
}

.resposta.errada{
    background:#ef4444;
    color:white;
}

#mensagem{
    font-size:18px;
    font-weight:bold;
    margin-top:15px;
}

.progresso{
    height:18px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

#barra{
    height:100%;
    width:0%;
    background:#22c55e;
}

.question{
    margin-top:20px;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.dark{
    background:#111827;
    color:#f9fafb;
}

.dark .card{
    background:#1f2937;
    color:white;
}

.dark .resposta{

function atualizar(){

document.getElementById("xp").textContent=xp;

let nivel=Math.floor(xp/100)+1;

document.getElementById("nivel").textContent=nivel;

let progresso=xp%100;

document.getElementById("barra").style.width=progresso+"%";

localStorage.setItem("xp",xp);

}

function carregarAssuntos(){

let materia=document.getElementById("materia").value;

let select=document.getElementById("assunto");

select.innerHTML="";

assuntos[materia].forEach(function(nome){

let option=document.createElement("option");

option.value=nome;

option.textContent=nome;

select.appendChild(option);

});

}

function assuntoAtual(){

return document.getElementById("assunto").value;

}

function mostrarExplicacao(){

let assunto=assuntoAtual();

let texto=explicacoes[assunto] || "Estude este assunto com atenção e depois faça os exercícios.";

document.getElementById("conteudo").innerHTML=
"<h2>📖 "+assunto+"</h2>"+
"<p>"+texto+"</p>"+
"<p>Agora você pode fazer os exercícios para praticar.</p>";

}

function mostrarExercicios(){

let assunto=assuntoAtual();

let lista=exercicios[assunto];

if(!lista){

document.getElementById("conteudo").innerHTML=
"<h2>✏️ Exercícios — "+assunto+"</h2>"+
"<p>Em breve teremos exercícios para este assunto.</p>";

return;

}

let html="<h2>✏️ Exercícios — "+assunto+"</h2>";

lista.forEach(function(q,index){

html+=
"<div class='question'>"+
"<strong>"+(index+1)+". "+q[0]+"</strong>";

q[1].forEach(function(opcao,i){

html+=
"<button class='resposta' data-questao='"+index+"' data-opcao='"+i+"'>"+
opcao+
"</button>";

});

html+="</div>";

});

document.getElementById("conteudo").innerHTML=html;

ativarRespostas(lista);

}

function ativarRespostas(lista){

let botoes=document.querySelectorAll(".resposta");

botoes.forEach(function(botao){

botao.addEventListener("click",function(){

let questao=Number(this.dataset.questao);

let escolhida=Number(this.dataset.opcao);

let correta=lista[questao][2];

let grupo=document.querySelectorAll(
".resposta[data-questao='"+questao+"']"
);

grupo.forEach(function(b){
b.disabled=true;
});

if(escolhida===correta){

this.classList.add("certa");

xp+=10;

atualizar();

document.getElementById("mensagem").textContent=
"🎉 Acertou! +10 XP";

}else{

this.classList.add("errada");

grupo[correta].classList.add("certa");

document.getElementById("mensagem").textContent=
"❌ Errou! A resposta correta ficou verde.";

}

});

});

}

function mostrarQuiz(){

let assunto=assuntoAtual();

let lista=exercicios[assunto];

if(!lista){

document.getElementById("conteudo").innerHTML=
"<h2>🧠 Quiz</h2>"+
"<p>Não existem perguntas cadastradas para este assunto ainda.</p>";

return;

}

let html="<h2>🧠 Quiz — "+assunto+"</h2>";

lista.forEach(function(q,index){

html+=
"<div class='question'>"+
"<strong>"+q[0]+"</strong>";

q[1].forEach(function(opcao,i){

html+=
"<button class='resposta' data-questao='"+index+"' data-opcao='"+i+"'>"+
opcao+
"</button>";

});

html+="</div>";

});

document.getElementById("conteudo").innerHTML=html;

ativarRespostas(lista);

}

document.getElementById("materia").addEventListener(
"change",

);

document.getElementById("explicacaoBtn").addEventListener(
"click",
mostrarExplicacao

document.getElementById("exerciciosBtn").addEventListener(

);

document.getElementById("quizBtn").addEventListener(

);

document.getElementById("escuroBtn").addEventListener(

function(){

document.body.classList.toggle("dark");

}
);

carregarAssuntos();

atualizar();

</script>
