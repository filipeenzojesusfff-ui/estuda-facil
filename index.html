<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudaFácil V8.4</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    color:#172033;
}

body.escuro{
    background:#121722;
    color:#f5f7fa;
}

header{
    background:#2563eb;
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.escuro .card{
    background:#1c2433;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccd3df;
    border-radius:10px;
    font-size:16px;
    background:white;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 16px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

.botoes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:15px;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.info div{
    background:#e8eefc;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.escuro .info div{
    background:#293449;
}

.barra{
    height:18px;
    background:#dbe2ea;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progresso{
    height:100%;
    width:0%;
    background:#22c55e;
    transition:.3s;
}

#resultado{
    line-height:1.6;
}

.question{
    border:1px solid #d7dce5;
    padding:15px;
    border-radius:12px;
    margin:15px 0;
}

.question button{
    display:block;
    width:100%;
    text-align:left;
}

.resposta{
    font-weight:bold;
    margin-top:8px;
}

.explicacao{
    line-height:1.7;
    font-size:17px;
}

.pequeno{
    font-size:14px;
    opacity:.8;
}

footer{
    text-align:center;
    padding:25px;
    opacity:.7;
}

@media(max-width:600px){
    .container{padding:10px}
    .card{padding:15px}
    button{width:100%;margin:4px 0}
}
</style>
</head>

<body>

<header>
    <h1>📚 EstudaFácil V8.4</h1>
    <p>Aprenda, pratique e evolua!</p>
</header>

<div class="container">

<div class="card">
    <h2>👤 Seu perfil</h2>

    <label>Seu nome</label>
    <input id="nome" placeholder="Digite seu nome">

    <div class="info">
        <div>⭐ XP: <span id="xp">0</span></div>
        <div>🏆 Nível: <span id="nivel">1</span></div>
        <div>🔥 Sequência: <span id="sequencia">0</span></div>
    </div>

    <p>Progresso para o próximo nível:</p>

    <div class="barra">
        <div class="progresso" id="barraProgresso"></div>
    </div>
</div>


<div class="card">
    <h2>📚 Escolha o que estudar</h2>

    <label>Ano escolar</label>

    <select id="ano">
        <option value="1º Ano">1º Ano</option>
        <option value="2º Ano">2º Ano</option>
        <option value="3º Ano">3º Ano</option>
        <option value="4º Ano">4º Ano</option>
        <option value="5º Ano">5º Ano</option>
        <option value="6º Ano" selected>6º Ano</option>
        <option value="7º Ano">7º Ano</option>
        <option value="8º Ano">8º Ano</option>
        <option value="9º Ano">9º Ano</option>
        <option value="1º Ensino Médio">1º Ensino Médio</option>
        <option value="2º Ensino Médio">2º Ensino Médio</option>
        <option value="3º Ensino Médio">3º Ensino Médio</option>
    </select>

    <label>Matéria</label>

    <select id="materia" onchange="carregarAssuntos()">
        <option value="Matemática">Matemática</option>
        <option value="Português">Português</option>
        <option value="História">História</option>
        <option value="Geografia">Geografia</option>
        <option value="Ciências">Ciências</option>
        <option value="Inglês">Inglês</option>
    </select>

    <label>Assunto</label>

    <select id="assunto">
        <option value="Números naturais">Números naturais</option>
    </select>

    <div class="botoes">
        <button onclick="mostrarComoFunciona()">📚 Como funciona?</button>
        <button onclick="mostrarExercicios()">✏️ Exercícios</button>
        <button onclick="mostrarQuiz()">🧠 Quiz</button>
        <button onclick="mostrarSimulado()">🎯 Simulado</button>
        <button onclick="modoEscuro()">🌙 Modo escuro</button>
        <button onclick="limparProgresso()">🗑️ Limpar progresso</button>
    </div>
</div>


<div class="card">
    <h2>🔎 Pesquisar assunto</h2>

    <input id="pesquisa" placeholder="Ex.: frações, verbos, mapas...">

    <button onclick="pesquisar()">🔎 Pesquisar</button>

    <div id="resultadoPesquisa"></div>
</div>


<div class="card">
    <div id="resultado">
        <h2>👋 Bem-vindo ao EstudaFácil!</h2>
        <p>Escolha uma matéria e um assunto para começar.</p>
    </div>
</div>

</div>

<footer>
    📚 EstudaFácil — estudando fica mais fácil!
</footer>

function carregarAssuntos(){

    var materia = document.getElementById("materia").value;
    var select = document.getElementById("assunto");

    select.innerHTML = "";

    var lista = dados[materia];

    for(var i=0;i<lista.length;i++){

        var option = document.createElement("option");

        option.value = lista[i];
        option.textContent = lista[i];

        select.appendChild(option);
    }
}


function adicionarXP(valor){

    var xp = Number(localStorage.getItem("xp") || 0);

    xp += valor;

    localStorage.setItem("xp",xp);

    atualizarPerfil();
}


function atualizarPerfil(){

    var xp = Number(localStorage.getItem("xp") || 0);

    var nivel = Math.floor(xp / 100) + 1;

    var atual = xp % 100;

    document.getElementById("xp").textContent = xp;
    document.getElementById("nivel").textContent = nivel;

    document.getElementById("barraProgresso").style.width = atual + "%";

    document.getElementById("nome").value =
        localStorage.getItem("nome") || "";

    document.getElementById("sequencia").textContent =
        localStorage.getItem("sequencia") || 0;
}


function mostrarComoFunciona(){

    var materia = document.getElementById("materia").value;
    var assunto = document.getElementById("assunto").value;

    var texto = explicacoes[assunto];

    if(!texto){
        texto = "Este assunto faz parte da matéria " + materia + ". Estude o conteúdo, observe exemplos e depois pratique com os exercícios.";
    }

    document.getElementById("resultado").innerHTML =
        "<h2>📚 " + assunto + "</h2>" +
        "<p class='pequeno'>Matéria: " + materia + "</p>" +
        "<div class='explicacao'>" +
        "<h3>📖 Explicação</h3>" +
        "<p>" + texto + "</p>" +
        "<h3>💡 Dica</h3>" +
        "<p>Leia com atenção, tente explicar o conteúdo com suas próprias palavras e depois faça os exercícios.</p>" +
        "</div>";

    adicionarXP(5);
}


function mostrarExercicios(){

    var assunto = document.getElementById("assunto").value;

    var lista = exercicios[assunto];

    if(!lista){

        lista = [
            [
                "Qual alternativa está relacionada a " + assunto + "?",
                ["Sim","Não","Talvez"],
                0
            ],
            [
                "Você estudou o conteúdo de " + assunto + "?",
                ["Sim","Ainda não","Não sei"],
                0
            ]
        ];
    }

    var html = "<h2>✏️ Exercícios — " + assunto + "</h2>";

    html += "<p>Escolha uma alternativa em cada questão.</p>";

    for(var i=0;i<lista.length;i++){

        var q = lista[i];

        html += "<div class='question'>";

        html += "<h3>" + (i+1) + ". " + q[0] + "</h3>";

        for(var j=0;j<q[1].length;j++){

            html +=
                "<button onclick=\"responder(this," +
                q[2] + "," +
                j + ")\">" +
                q[1][j] +
                "</button>";
        }

        html += "<div class='resposta'></div>";

        html += "</div>";
    }

    document.getElementById("resultado").innerHTML = html;
}


function responder(botao, correta, escolhida){

    var area = botao.parentElement.querySelector(".resposta");

    var botoes = botao.parentElement.querySelectorAll("button");

    for(var i=0;i<botoes.length;i++){
        botoes[i].disabled = true;
    }

    if(escolhida === correta){

        area.textContent = "✅ Acertou! +10 XP";
        adicionarXP(10);

    }else{

        area.textContent = "❌ Não foi dessa vez. Continue estudando!";
    }
}


function mostrarQuiz(){

    var assunto = document.getElementById("assunto").value;

    var lista = exercicios[assunto];

    if(!lista){
        mostrarExercicios();
        return;
    }

    var q = lista[0];

    var html =
        "<h2>🧠 Quiz — " + assunto + "</h2>" +
        "<div class='question'>" +
        "<h3>" + q[0] + "</h3>";

    for(var i=0;i<q[1].length;i++){

        html +=
            "<button onclick=\"responder(this," +
            q[2] + "," +
            i + ")\">" +
            q[1][i] +
            "</button>";
    }

    html += "<div class='resposta'></div></div>";

    document.getElementById("resultado").innerHTML = html;
}


function mostrarSimulado(){

    var assunto = document.getElementById("assunto").value;

    var lista = exercicios[assunto];

    if(!lista){
        mostrarExercicios();
        return;
    }

    var html =
        "<h2>🎯 Simulado — " + assunto + "</h2>" +
        "<p>Responda às questões abaixo.</p>";

    for(var i=0;i<lista.length;i++){

        var q = lista[i];

        html += "<div class='question'>";
        html += "<h3>" + (i+1) + ". " + q[0] + "</h3>";

        for(var j=0;j<q[1].length;j++){

            html +=
                "<button onclick=\"responder(this," +
                q[2] + "," +
                j + ")\">" +
                q[1][j] +
                "</button>";
        }

        html += "<div class='resposta'></div>";
        html += "</div>";
    }

    document.getElementById("resultado").innerHTML = html;
}


function pesquisar(){

    var busca =
        document.getElementById("pesquisa").value
        .toLowerCase()
        .trim();

    var resultado =
        document.getElementById("resultadoPesquisa");

    if(busca === ""){

        resultado.innerHTML =
            "<p>Digite um assunto para pesquisar.</p>";

        return;
    }

    var encontrados = [];

    for(var materia in dados){

        for(var i=0;i<dados[materia].length;i++){

            var assunto = dados[materia][i];

            if(assunto.toLowerCase().indexOf(busca) !== -1){

                encontrados.push(
                    materia + ": " + assunto
                );
            }
        }
    }

    if(encontrados.length === 0){

        resultado.innerHTML =
            "<p>❌ Nenhum assunto encontrado.</p>";

    }else{

        resultado.innerHTML =
            "<h3>🔎 Resultados:</h3><p>" +
            encontrados.join("<br>")
