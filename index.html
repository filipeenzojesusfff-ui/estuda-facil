<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EstudaFácil V8</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
    transition: 0.3s;
}

header {
    background: #2563eb;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 17px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    font-size: 27px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    font-size: 17px;
    background: white;
    color: #111827;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    margin: 6px 5px 6px 0;
    font-size: 16px;
    color: white;
    background: #2563eb;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.btn-green {
    background: #16a34a;
}

.btn-purple {
    background: #7c3aed;
}

.btn-orange {
    background: #ea580c;
}

.btn-dark {
    background: #374151;
}

.btn-red {
    background: #dc2626;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: #eff6ff;
    padding: 16px;
    text-align: center;
    border-radius: 13px;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-bottom: 5px;
}

.progress {
    width: 100%;
    height: 16px;
    background: #dbeafe;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: 0.4s;
}

.actions {
    margin-top: 15px;
}

.explanation {
    background: #eff6ff;
    border-left: 6px solid #2563eb;
    padding: 18px;
    border-radius: 12px;
    line-height: 1.7;
}

.example {
    background: #fef3c7;
    border-left: 6px solid #f59e0b;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
    line-height: 1.7;
}

.question {
    background: #f8fafc;
    padding: 18px;
    border-radius: 14px;
    margin: 15px 0;
}

.question h3 {
    margin-top: 0;
}

.resultado {
    font-weight: bold;
    margin-top: 10px;
}

.search {
    display: flex;
    gap: 8px;
}

.search input {
    flex: 1;
}

.search button {
    margin: 0;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

/* MODO ESCURO */

body.dark {
    background: #111827;
    color: #f3f4f6;
}

body.dark .card {
    background: #1f2937;
}

body.dark input,
body.dark select {
    background: #374151;
    color: white;
    border-color: #4b5563;
}

body.dark .stat {
    background: #374151;
}

body.dark .explanation {
    background: #1e3a5f;
}

body.dark .example {
    background: #4a3b18;
}

body.dark .question {
    background: #374151;
}

body.dark footer {
    color: #9ca3af;
}

@media (max-width: 650px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .search {
        flex-direction: column;
    }

    .search button {
        width: 100%;
    }

    header h1 {
        font-size: 27px;
    }
}

</style>
</head>

<body>

<header>

    <h1>📚 EstudaFácil</h1>

    <p>
        Aprenda, pratique e prepare-se para suas provas!
    </p>

</header>


<div class="container">


<!-- PERFIL -->

<div class="card">

    <h2>👤 Seu perfil</h2>

    <label>Seu nome</label>

    <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
    >

    <label>Ano escolar</label>

    <select id="ano">

        <option>1º ano</option>
        <option>2º ano</option>
        <option>3º ano</option>
        <option>4º ano</option>
        <option>5º ano</option>
        <option>6º ano</option>
        <option>7º ano</option>
        <option>8º ano</option>
        <option>9º ano</option>

        <option>1º ano do Ensino Médio</option>
        <option>2º ano do Ensino Médio</option>
        <option>3º ano do Ensino Médio</option>

    </select>

</div>


<!-- PROGRESSO -->

<div class="card">

    <h2>📊 Seu progresso</h2>

    <div class="stats">

        <div class="stat">
            <strong id="xp">0</strong>
            XP
        </div>

        <div class="stat">
            <strong id="nivel">1</strong>
            Nível
        </div>

        <div class="stat">
            <strong id="sequencia">0</strong>
            🔥 Dias
        </div>

        <div class="stat">
            <strong>100</strong>
            Meta XP
        </div>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="barra"
        ></div>

    </div>

</div>


<!-- ESCOLHA -->

<div class="card">

    <h2>📚 Escolha o que estudar</h2>

    <label>Matéria</label>

    <select id="materia">

        <option value="Matemática">
            ➗ Matemática
        </option>

        <option value="Português">
            📖 Português
        </option>

        <option value="História">
            🏛️ História
        </option>

        <option value="Geografia">
            🌎 Geografia
        </option>

        <option value="Ciências">
            🔬 Ciências
        </option>

        <option value="Inglês">
            🇺🇸 Inglês
        </option>

    </select>


    <label>Assunto</label>

    <select id="assunto">
        <option>Carregando...</option>
    </select>


    <div class="actions">

        <button onclick="mostrarComoFunciona()">
            📚 Como funciona?
        </button>

        <button
            class="btn-green"
            onclick="mostrarExercicios()"
        >
            ✏️ Exercícios
        </button>

        <button
            class="btn-purple"
            onclick="mostrarQuiz()"
        >
            🧠 Quiz
        </button>

        <button
            class="btn-orange"
            onclick="mostrarSimulado()"
        >
            🎯 Simulado
        </button>

        <button
            class="btn-dark"
            onclick="modoEscuro()"
        >
            🌙 Modo escuro
        </button>

        <button
            class="btn-red"
            onclick="zerarProgresso()"
        >
            🗑️ Limpar progresso
        </button>

    </div>

</div>


<!-- PESQUISA -->

<div class="card">

    <h2>🔎 Procurar assunto</h2>

    <div class="search">

        <input
            id="pesquisa"
            placeholder="Ex.: frações, verbos, células..."
        >

        <button onclick="pesquisar()">
            🔍 Pesquisar
        </button>

    </div>

</div>


<!-- CONTEÚDO -->

<div class="card">

    <h2 id="tituloConteudo">
        📚 Conteúdo
    </h2>

    <div id="conteudo">

        Escolha uma matéria e um assunto
        para começar a estudar.

    </div>

</div>


</div>


<footer>

    📚 EstudaFácil<br>
    Estude de forma simples e gratuita.

</footer>


<script>

/* ==================================================
   LISTA DE ASSUNTOS
================================================== */

const assuntos = {

    "Matemática": [
        "Números naturais",
        "Adição e subtração",
        "Multiplicação e divisão",
        "Frações",
        "Números decimais",
        "Porcentagem",
        "Razão e proporção",
        "Regra de três",
        "Potenciação",
        "Radiciação",
        "Equações",
        "Geometria",
        "Perímetro",
        "Área",
        "Média"
    ],

    "Português": [
        "Alfabeto",
        "Substantivos",
        "Adjetivos",
        "Verbos",
        "Pronomes",
        "Advérbios",
        "Pontuação",
        "Acentuação",
        "Ortografia",
        "Interpretação de texto",
        "Sujeito e predicado",
        "Sinônimos e antônimos"
    ],

    "História": [
        "Pré-História",
        "Antiguidade",
        "Egito Antigo",
        "Grécia Antiga",
        "Roma Antiga",
        "Idade Média",
        "Grandes Navegações",
        "Brasil Colônia",
        "Independência do Brasil",
        "Império do Brasil",
        "República",
        "Revolução Industrial"
    ],

    "Geografia": [
        "Planeta Terra",
        "Continentes",
        "Oceanos",
        "Mapas",
        "Coordenadas geográficas",
        "Latitude e longitude",
        "Clima",
        "Relevo",
        "Vegetação",
        "População",
        "Urbanização",
        "Globalização"
    ],

    "Ciências": [
        "Seres vivos",
        "Corpo humano",
        "Células",
        "Sistema digestório",
        "Sistema respiratório",
        "Sistema circulatório",
        "Animais",
        "Plantas",
        "Ecossistemas",
        "Cadeia alimentar",
        "Água",
        "Sistema Solar"
    ],

    "Inglês": [
        "Greetings",
        "Numbers",
        "Colors",
        "Family",
        "School",
        "Days of the week",
        "Months",
        "Verb to be",
        "Simple Present",
        "Pronouns",
        "Animals",
        "Food"
    ]

};


/* ==================================================
   ELEMENTOS
================================================== */

const materia =
    document.getElementById("materia");

const assunto =
    document.getElementById("assunto");

const ano =
    document.getElementById("ano");

const nome =
    document.getElementById("nome");

const conteudo =
    document.getElementById("conteudo");

const tituloConteudo =
    document.getElementById("tituloConteudo");


/* ==================================================
   CARREGAR ASSUNTOS
================================================== */

function carregarAssuntos() {

    const materiaEscolhida =
        materia.value;

    assunto.innerHTML = "";

    const lista =
        assuntos[materiaEscolhida];

    if (!lista) {

        assunto.innerHTML =
            "<option>Nenhum assunto</option>";

        return;
    }

    lista.forEach(function(item) {

        const option =
            document.createElement("option");

        option.value = item;

        option.textContent = item;

        assunto.appendChild(option);

    });

}


/* ==================================================
   EXPLICAÇÕES
================================================== */

function obterExplicacao(materiaNome, assuntoNome) {

    if (
        materiaNome === "Matemática" &&
        assuntoNome === "Multiplicação e divisão"
    ) {

        return {
            titulo: "➗ Multiplicação e divisão",

            texto:
            "Multiplicação é uma forma de somar a mesma quantidade várias vezes. " +
            "Já a divisão serve para repartir uma quantidade em partes iguais ou descobrir " +
            "quantas vezes um número cabe em outro.",

            exemplo:
            "Exemplo: 4 × 3 = 12, porque 4 + 4 + 4 = 12. " +
            "Na divisão, 12 ÷ 3 = 4, porque podemos separar 12 em 3 grupos iguais de 4."
        };

    }


    if (
        materiaNome === "Matemática" &&
        assuntoNome === "Frações"
    ) {

        return {
            titulo: "🍕 Frações",

            texto:
            "Uma fração representa uma parte de um todo. " +
            "O número de cima é chamado de numerador e mostra quantas partes estamos considerando. " +
            "O número de baixo é o denominador e mostra em quantas partes iguais o todo foi dividido.",

            exemplo:
            "Exemplo: 3/4 significa que um todo foi dividido em 4 partes iguais " +
            "e estamos considerando 3 dessas partes."
        };

    }


    if (
        materiaNome === "Matemática" &&
        assuntoNome === "Porcentagem"
    ) {

        return {
            titulo: "💯 Porcentagem",

            texto:
            "Porcentagem representa uma parte de 100. " +
            "O símbolo usado para representar porcentagem é %. " +
            "Ela aparece em descontos, aumentos, pesquisas e muitas outras situações.",

            exemplo:
            "Exemplo: 50% significa 50 partes de cada 100. " +
            "50% de 100 = 50."
        };

    }


    if (
        materiaNome === "Matemática" &&
        assuntoNome === "Números naturais"
    ) {

        return {
            titulo: "🔢 Números naturais",

            texto:
            "Os números naturais são usados para contar e ordenar. " +
            "Eles aparecem em situações do nosso dia a dia, como quantidade de pessoas, " +
            "objetos e posições.",

            exemplo:
            "Exemplos: 0, 1, 2, 3, 4, 5, 6..."
        };

    }


    if (
        materiaNome === "Português" &&
        assuntoNome === "Verbos"
    ) {

        return {
            titulo: "📖 Verbos",

            texto:
            "Verbos são palavras que podem indicar ações, estados ou acontecimentos. " +
            "Eles podem mudar de acordo com o tempo e com a pessoa que realiza a ação.",

            exemplo:
            "Exemplo: Eu estudo. Eu estudei. Eu estudarei."
        };

    }


    if (
        materiaNome === "Português" &&
        assuntoNome === "Substantivos"
    ) {

        return {
            titulo: "📖 Substantivos",

            texto:
            "Substantivos são palavras usadas para nomear pessoas, animais, lugares, objetos, " +
            "sentimentos e muitas outras coisas.",

            exemplo:
            "Exemplos: aluno, cachorro, escola, Brasil, alegria e computador."
        };

    }


    if (
        materiaNome === "Geografia" &&
        assuntoNome === "Latitude e longitude"
    ) {

        return {
            titulo: "🌎 Latitude e longitude",

            texto:
            "Latitude e longitude são usadas para localizar lugares na superfície da Terra. " +
            "A latitude indica a posição ao norte ou ao sul do Equador. " +
            "A longitude indica a posição a leste ou a oeste do Meridiano de Greenwich.",

            exemplo:
            "Exemplo: coordenadas geográficas podem indicar exatamente a localização de um lugar."
        };

    }


    if (
        materiaNome === "Ciências" &&
        assuntoNome === "Sistema Solar"
    ) {

        return {
            titulo: "🪐 Sistema Solar",

            texto:
            "O Sistema Solar é formado pelo Sol e pelos corpos celestes que ficam sob sua influência gravitacional. " +
            "Entre seus planetas estão Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano e Netuno.",

            exemplo:
            "A Terra é o terceiro planeta a partir do Sol."
        };

    }


    if (
        materiaNome === "Ciências" &&
        assuntoNome === "Células"
    ) {

        return {
            titulo: "🔬 Células",

            texto:
            "A célula é a unidade básica dos seres vivos. " +
            "Alguns seres vivos possuem apenas uma célula, enquanto outros possuem muitas células.",

            exemplo:
            "O corpo humano é formado por uma enorme quantidade de células especializadas."
        };

    }


    if (
        materiaNome === "História" &&
        assuntoNome === "Independência do Brasil"
    ) {

        return {
            titulo: "🇧🇷 Independência do Brasil",

            texto:
            "A Independência do Brasil foi declarada em 7 de setembro de 1822. " +
            "O processo marcou a separação política do Brasil em relação a Portugal.",

            exemplo:
            "A data de 7 de setembro é lembrada todos os anos como o Dia da Independência do Brasil."
        };

    }


    if (
        materiaNome === "Inglês" &&
        assuntoNome === "Greetings"
    ) {

        return {
            titulo: "🇺🇸 Greetings",

            texto:
            "Greetings são cumprimentos usados para iniciar uma conversa em inglês. " +
            "Eles podem ser usados em situações formais ou informais.",

            exemplo:
            "Hello = Olá.  Hi = Oi.  Good morning = Bom dia.  Good afternoon = Boa tarde."
        };

    }


    return {

        titulo:
        "📚 " + assuntoNome,

        texto:
        "Neste conteúdo você vai aprender os principais conceitos relacionados a " +
        assuntoNome + ". " +
        "A ideia é entender como o assunto funciona antes de começar os exercícios.",

        exemplo:
        "Leia a explicação com atenção e depois pratique para verificar o que você aprendeu."
    };

}


/* ==================================================
   COMO FUNCIONA
================================================== */

function mostrarComoFunciona() {

    const explicacao =
        obterExplicacao(
            materia.value,
            assunto.value
        );

    tituloConteudo.textContent =
        "📚 Como funciona?";

    conteudo.innerHTML =

        "<div class='explanation'>" +

        "<h2>" +
        explicacao.titulo +
        "</h2>" +

        "<p>" +
        explicacao.texto +
        "</p>" +

        "</div>" +

        "<div class='example'>" +

        "<strong>💡 Exemplo:</strong>" +

        "<p>" +
        explicacao.exemplo +
        "</p>" +

        "</div>" +

        "<p>" +
        "📌 Você está estudando este conteúdo no " +
        "<strong>" +
        ano.value +
        "</strong>." +
        "</p>";

    ganharXP(5);

}


/* ==================================================
   EXERCÍCIOS
================================================== */

function mostrarExercicios() {

    const tema = assunto.value;

    tituloConteudo.textContent =
        "✏️ Exercícios — " + tema;


    let html = "";


    if (tema === "Multiplicação e divisão") {

        html =

        criarQuestao(
            "Quanto é 6 × 4?",
            ["24", "20", "18"],
            0
        ) +

        criarQuestao(
            "Quanto é 36 ÷ 6?",
            ["5", "6", "7"],
            1
        ) +

        criarQuestao(
            "Quanto é 8 × 7?",
            ["54", "56", "64"],
            1
        );

    }


    else if (tema === "Frações") {

        html =

        criarQuestao(
            "Qual é o numerador da fração 3/5?",
            ["3", "5", "8"],
            0
        ) +

        criarQuestao(
            "Qual é o denominador da fração 2/7?",
            ["2", "5", "7"],
            2
        ) +

        criarQuestao(
            "Qual fração representa uma metade?",
            ["1/2", "1/3", "2/3"],
            0
        );

    }


    else if (tema === "Porcentagem") {

        html =

        criarQuestao(
            "Quanto é 50% de 100?",
            ["25", "50", "75"],
            1
        ) +

        criarQuestao(
            "Quanto é 10% de 100?",
            ["5", "10", "20"],
            1
        ) +

        criarQuestao(
            "25% corresponde a quantas partes de 100?",
            ["10", "20", "25"],
            2
        );

    }


    else if (tema === "Números naturais") {

        html =

        criarQuestao(
            "Qual destes é um número natural?",
            ["5", "-5", "1,5"],
            0
        ) +

        criarQuestao(
            "Quanto é 12 + 8?",
            ["18", "20", "22"],
            1
        );

    }


    else if (tema === "Verbos") {

        html =

        criarQuestao(
            "Qual palavra é um verbo?",
            ["correr", "mesa", "azul"],
            0
        ) +

        criarQuestao(
            "Qual destas palavras indica uma ação?",
            ["estudar", "caderno", "escola"],
            0
        );

    }


    else if (tema === "Substantivos") {

        html =

        criarQuestao(
            "Qual palavra é um substantivo?",
            ["cachorro", "correr", "bonito"],
            0
        ) +

        criarQuestao(
            "Qual palavra nomeia um lugar?",
            ["escola", "rápido
