<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3637602207396334"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudaFácil 📚</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
  transition:.3s;
}

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  font-size:32px;
  margin-bottom:8px;
}

header p{
  font-size:16px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.materias{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.materia{
  border:0;
  padding:15px 8px;
  border-radius:12px;
  background:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 10px #0001;
}

.materia.ativa{
  background:#2563eb;
  color:white;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px #0001;
}

h2{
  margin-bottom:10px;
}

h3{
  margin:15px 0 8px;
}

.assuntos{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.assunto{
  background:#e0e7ff;
  border:0;
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
}

.assunto.ativo{
  background:#7c3aed;
  color:white;
}

.explicacao{
  line-height:1.6;
  margin-top:15px;
}

.exemplo{
  background:#f0fdf4;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
}

.questao{
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:12px;
}

.respostas button{
  display:block;
  width:100%;
  text-align:left;
  border:1px solid #ddd;
  background:white;
  padding:12px;
  border-radius:9px;
  margin:7px 0;
  cursor:pointer;
}

.respostas button:hover{
  background:#eef2ff;
}

#resultado{
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}

.xp{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 10px #0001;
}

.dark{
  background:#111827;
  color:#f9fafb;
}

.dark .card,
.dark .materia,
.dark .xp{
  background:#1f2937;
  color:white;
}

.dark .respostas button{
  background:#374151;
  color:white;
  border-color:#4b5563;
}

.dark .questao{
  background:#111827;
}

.dark .exemplo{
  background:#064e3b;
}

.topo-botoes{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:15px;
}

.topo-botoes button{
  border:0;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

@media(min-width:600px){
  .materias{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 EstudaFácil</h1>
  <p>Estude, pratique e aprenda!</p>

  <div class="topo-botoes">
    <button onclick="alternarTema()">🌙 Modo escuro</button>
  </div>
</header>

<div class="container">

  <div class="xp">
    ⭐ XP: <span id="xp">0</span>
    &nbsp; | &nbsp;
    🏆 Nível: <span id="nivel">1</span>
  </div>

  <div class="card">
    <h2>📚 Escolha uma matéria</h2>

    <div class="materias">

      <button class="materia ativa" onclick="mudarMateria('matematica',this)">
        ➗ Matemática
      </button>

      <button class="materia" onclick="mudarMateria('portugues',this)">
        📖 Português
      </button>

      <button class="materia" onclick="mudarMateria('historia',this)">
        🏛️ História
      </button>

      <button class="materia" onclick="mudarMateria('geografia',this)">
        🌎 Geografia
      </button>

      <button class="materia" onclick="mudarMateria('ciencias',this)">
        🔬 Ciências
      </button>

      <button class="materia" onclick="mudarMateria('ingles',this)">
        🇺🇸 Inglês
      </button>

      <button class="materia" onclick="mudarMateria('educacao',this)">
        ⚽ Educação Física
      </button>

      <button class="materia" onclick="mudarMateria('artes',this)">
        🎨 Artes
      </button>

    </div>
  </div>

  <div class="card">
    <h2 id="tituloMateria">➗ Matemática</h2>

    <h3>📚 Assuntos</h3>

    <div class="assuntos" id="listaAssuntos"></div>

    <div class="explicacao">
      <h3 id="tituloAssunto"></h3>
      <div id="textoExplicacao"></div>
      <div class="exemplo" id="exemplo"></div>
    </div>
  </div>

  <div class="card">
    <h2>📝 Exercício</h2>

    <div class="questao">
      <h3 id="pergunta"></h3>
      <div class="respostas" id="respostas"></div>
      <div id="resultado"></div>
    </div>
  </div>

</div>

<script>

let xp = Number(localStorage.getItem("estudaXP")) || 0;

let materiaAtual = "matematica";

let assuntoAtual = "";

const dados = {

matematica:{
  nome:"➗ Matemática",
  assuntos:{
    "Operações básicas":{
      explicacao:"As quatro operações básicas são adição, subtração, multiplicação e divisão.",
      exemplo:"Exemplo: 25 + 15 = 40"
    },
    "Frações":{
      explicacao:"Frações representam partes de um todo. O número de cima é o numerador e o de baixo é o denominador.",
      exemplo:"Exemplo: 1/2 significa uma de duas partes iguais."
    },
    "Porcentagem":{
      explicacao:"Porcentagem representa uma parte de 100.",
      exemplo:"Exemplo: 50% de 100 = 50."
    },
    "Geometria":{
      explicacao:"Geometria estuda formas, medidas, ângulos, perímetros e áreas.",
      exemplo:"Um quadrado com lado de 5 cm tem perímetro de 20 cm."
    },
    "Equações":{
      explicacao:"Uma equação é uma igualdade que possui um valor desconhecido.",
      exemplo:"x + 5 = 12 → x = 7."
    }
  }
},

portugues:{
  nome:"📖 Português",
  assuntos:{
    "Substantivos":{
      explicacao:"Substantivo é a palavra que dá nome a pessoas, animais, lugares, objetos e sentimentos.",
      exemplo:"Exemplo: casa, cachorro, Brasil, alegria."
    },
    "Adjetivos":{
      explicacao:"Adjetivos são palavras que caracterizam os substantivos.",
      exemplo:"Exemplo: casa grande, menino inteligente."
    },
    "Verbos":{
      explicacao:"Verbos indicam ações, estados ou acontecimentos.",
      exemplo:"Exemplo: correr, estudar, brincar."
    },
    "Pontuação":{
      explicacao:"A pontuação ajuda a organizar e dar sentido ao texto.",
      exemplo:"Exemplo: ponto final (.), vírgula (,) e ponto de interrogação (?)."
    }
  }
},

historia:{
  nome:"🏛️ História",
  assuntos:{
    "Brasil Colonial":{
      explicacao:"O período colonial foi a época em que o Brasil esteve sob domínio de Portugal.",
      exemplo:"A colonização portuguesa começou oficialmente em 1500."
    },
    "Independência do Brasil":{
      explicacao:"A Independência do Brasil foi declarada em 7 de setembro de 1822.",
      exemplo:"O processo foi associado a Dom Pedro."
    },
    "Revolução Francesa":{
      explicacao:"A Revolução Francesa começou em 1789 e provocou grandes mudanças políticas e sociais.",
      exemplo:"Um dos seus símbolos foi a queda da Bastilha."
    }
  }
},

geografia:{
  nome:"🌎 Geografia",
  assuntos:{
    "Mapas":{
      explicacao:"Mapas são representações reduzidas de lugares da superfície terrestre.",
      exemplo:"Mapas podem mostrar países, cidades, rios e relevo."
    },
    "Clima":{
      explicacao:"Clima é o conjunto das condições atmosféricas observadas durante longos períodos.",
      exemplo:"Brasil possui diferentes tipos de clima."
    },
    "Relevo":{
      explicacao:"Relevo é o conjunto das diferentes formas da superfície terrestre.",
      exemplo:"Montanhas, planaltos e planícies são formas de relevo."
    }
  }
},

ciencias:{
  nome:"🔬 Ciências",
  assuntos:{
    "Sistema respiratório":{
      explicacao:"O sistema respiratório é responsável pelas trocas gasosas entre o organismo e o ambiente.",
      exemplo:"Ele envolve órgãos como nariz, faringe, laringe, traqueia e pulmões."
    },
    "Corpo humano":{
      explicacao:"O corpo humano é formado por vários sistemas que trabalham juntos.",
      exemplo:"Sistema digestório, respiratório, circulatório e nervoso."
    },
    "Sistema Solar":{
      explicacao:"O Sistema Solar é formado pelo Sol e pelos corpos celestes que orbitam ao seu redor.",
      exemplo:"A Terra é um dos planetas do Sistema Solar."
    }
  }
},

ingles:{
  nome:"🇺🇸 Inglês",
  assuntos:{
    "Verb to be":{
      explicacao:"O verbo to be pode significar ser ou estar.",
      exemplo:"I am = eu sou / eu estou."
    },
    "Números":{
      explicacao:"Os números em inglês possuem nomes próprios.",
      exemplo:"One = 1, two = 2, three = 3."
    },
    "Cores":{
      explicacao:"Algumas cores em inglês são: red, blue, green e yellow.",
      exemplo:"Blue = azul."
    }
  }
},

educacao:{
  nome:"⚽ Educação Física",
  assuntos:{
    "Esportes de invasão":{
      explicacao:"São esportes em que equipes tentam ocupar o espaço adversário para marcar pontos.",
      exemplo:"Futebol, basquete e handebol."
    },
    "Esportes de precisão":{
      explicacao:"São esportes em que a precisão para atingir um alvo é importante.",
      exemplo:"Tiro ao alvo e bocha."
    },
    "Esportes de marca":{
      explicacao:"São esportes em que o resultado pode ser medido por tempo, distância ou altura.",
      exemplo:"Corridas, saltos e arremessos."
    }
  }
},

artes:{
  nome:"🎨 Artes",
  assuntos:{
    "Cores":{
      explicacao:"As cores são elementos importantes para criar diferentes efeitos visuais.",
      exemplo:"Cores primárias: vermelho, amarelo e azul."
    },
    "Desenho":{
      explicacao:"O desenho utiliza linhas, formas e outros elementos para representar ideias ou objetos.",
      exemplo:"Um desenho pode ser realista ou imaginário."
    },
    "Música":{
      explicacao:"A música utiliza sons, ritmos e melodias para criar uma expressão artística.",
      exemplo:"Instrumentos musicais produzem diferentes sons."
    }
  }
}

};

function atualizarXP(){
  document.getElementById("xp").textContent = xp;
  document.getElementById("nivel").textContent =
    Math.floor(xp/100)+1;

  localStorage.setItem("estudaXP",xp);
}

function mudarMateria(materia,botao){

  materiaAtual = materia;

  document.querySelectorAll(".materia")
  .forEach(b => b.classList.remove("ativa"));

  botao.classList.add("ativa");

  document.getElementById("tituloMateria").textContent =
    dados[materia].nome;

  carregarAssuntos();

}

function carregarAssuntos(){

  const lista =
    document.getElementById("listaAssuntos");

  lista.innerHTML="";

  const assuntos =
    dados[materiaAtual].assuntos;

  Object.keys(assuntos).forEach((nome,i)=>{

    const botao=document.createElement("button");

    botao.className="assunto";

    botao.textContent=nome;

    botao.onclick=()=>selecionarAssunto(nome,botao);

    lista.appendChild(botao);

    if(i===0){
      selecionarAssunto(nome,botao);
    }

  });

}

function selecionarAssunto(nome,botao){

  assuntoAtual=nome;

  document.querySelectorAll(".assunto")
  .forEach(b=>b.classList.remove("ativo"));

  botao.classList.add("ativo");

  const assunto =
    dados[materiaAtual].assuntos[nome];

  document.getElementById("tituloAssunto").textContent =
    "💡 "+nome;

  document.getElementById("textoExplicacao").textContent =
    assunto.explicacao;

  document.getElementById("exemplo").textContent =
    "📌 "+assunto.exemplo;

  carregarQuestao();

}

function carregarQuestao(){

  const perguntas = {

    "Frações":{
      pergunta:"Qual é a metade de 10?",
      respostas:["2","5","10","20"],
      correta:1
    },

    "Porcentagem":{
      pergunta:"Quanto é 50% de 100?",
      respostas:["10","25","50","75"],
      correta:2
    },

    "Geometria":{
      pergunta:"Um quadrado possui quantos lados?",
      respostas:["3","4","5","6"],
      correta:1
    },

    "Sistema respiratório":{
      pergunta:"Qual órgão é responsável pelas principais trocas gasosas?",
      respostas:["Estômago","Pulmões","Coração","Fígado"],
      correta:1
    },

    "Verb to be":{
      pergunta:"Qual significa 'I am'?",
      respostas:["Eu tenho","Eu sou/estou","Eu vou","Eu faço"],
      correta:1
    },

    "Substantivos":{
      pergunta:"Qual palavra é um substantivo?",
      respostas:["Bonito","Correr","Casa","Rapidamente"],
      correta:2
    }

  };

  const q = perguntas[assuntoAtual] || {
    pergunta:"Qual é uma característica importante deste assunto?",
    respostas:[
      "Ele pode ser estudado e aprendido",
      "Não pode ser estudado",
      "Não existe",
      "Nenhuma das opções"
    ],
    correta:0
  };

  document.getElementById("pergunta").textContent =
    q.pergunta;

  const area=document.getElementById("respostas");

  area.innerHTML="";

  document.getElementById("resultado").textContent="";

  q.respostas.forEach((resposta,i)=>{

    const botao=document.createElement("button");

    botao.textContent=resposta;

    botao.onclick=()=>responder(i,q.correta);

    area.appendChild(botao);

  });

}

function responder(escolha,correta){

  const resultado=document.getElementById("resultado");

  if(escolha===correta){

    resultado.textContent="✅ Acertou! +10 XP";

    xp+=10;

    atualizarXP();

  }else{

    resultado.textContent="❌ Errou! Tente novamente.";

  }

}

function alternarTema(){

  document.body.classList.toggle("dark");

}

atualizarXP();

carregarAssuntos();

</script>

</body>
</html>
