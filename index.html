}

    color:white;
}

}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:2px solid #d2d7e0;
    background:white;
    font-size:17px;
}

.dark input{
    background:#252e40;
    color:white;
    border-color:#47536a;
}

    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin:7px 0;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

.menu button{

}

.menu .roxo{

}

.menu .laranja{

.menu .verde{

}

.questao{

.resultado{

}

.xp{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.xp div{
    flex:1;
    min-width:130px;
    background:#eef2ff;
    padding:14px;
    border-radius:12px;
    text-align:center;
}

.dark .xp div{
    background:#293348;
}

#mensagem{
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

footer{
    text-align:center;
    padding:30px;
    color:#667085;

</header>

        <select id="ano">
            <option value="">Escolha o ano</option>

            <option value="9º ano">9º ano</option>

        </select>
    </div>

    <div class="card">
        <h2>⭐ Seu progresso</h2>

        <div class="xp">
            <div>
                <strong id="xp">0</strong>
                <br>XP
            </div>

            <div>
                Nível
                <br>
                <strong id="nivel">1</strong>
            </div>

            <div>
                🏆
                <br>
                <strong id="acertosTotal">0</strong>
                acertos

        </div>
    </div>

    <div id="mensagem"></div>

    <div class="card menu">

        <button id="explicacao">📖 Explicação</button>

        <button id="exercicios">✏️ Exercícios</button>

        <button id="quiz">🧠 Quiz</button>

        <button id="provinha">📝 Provinha do assunto</button>

        <button id="simulado" class="laranja">
            🎯 Simulado geral

        <button id="modoEscuro">
            🌙 Modo escuro
        </button>

        <button id="limpar" class="vermelho">
            🗑️ Limpar progresso
        </button>

    </div>

</div>

let xp = Number(localStorage.getItem("estuda_xp") || 0);
let acertosTotal = Number(localStorage.getItem("estuda_acertos") || 0);


function atualizarProgresso(){

    document.getElementById("xp").textContent = xp;

    document.getElementById("nivel").textContent =
        Math.floor(xp / 100) + 1;

    document.getElementById("acertosTotal").textContent =
        acertosTotal;

    localStorage.setItem("estuda_xp",xp);
    localStorage.setItem("estuda_acertos",acertosTotal);
}


function carregarAssuntos(){

    const ano =
        document.getElementById("ano").value;

    const materia =
        document.getElementById("materia").value;

    const assunto =
        document.getElementById("assunto");

    assunto.innerHTML =
        '<option value="">Escolha um assunto</option>';

    if(!ano || !materia){
        return;
    }

    const lista =
        DADOS[ano][materia];

    lista.forEach(function(item){

        const option =
            document.createElement("option");

        option.value = item;
        option.textContent = item;

        assunto.appendChild(option);
    });
}


function mostrarExplicacao(){

    const assunto =
        document.getElementById("assunto").value;

    const area =
        document.getElementById("conteudo");

    if(!assunto){

        area.innerHTML =
            '<div class="card"><h2>⚠️ Escolha um assunto primeiro.</h2></div>';

        return;
    }

    const texto =
        EXPLICACOES[assunto] ||
        "Este assunto faz parte do conteúdo estudado. Leia, pratique e tente os desafios para aprender melhor.";

    area.innerHTML = `
        <div class="card">
            <h2>📖 ${assunto}</h2>
            <p>${texto}</p>

            <hr>

            <h3>💡 Dica</h3>

            <p>
                Depois de ler a explicação, faça os exercícios
                e depois tente a provinha.
            </p>
        </div>
    `;
}
